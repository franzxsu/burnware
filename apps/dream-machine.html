<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dream Machine: a surreal world generator. A different dream every time.">
<meta name="theme-color" content="#5c1408">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Dream Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Dream Machine: a quiet, night-time look. The world fills the screen; controls float over it on
   smoked glass, and get out of the way (Hide) when you just want to look. One deliberate dark theme. */
:root {
  color-scheme: dark;
  --ink: #07080f; --glass: rgba(14, 16, 28, .72); --glass2: rgba(255, 255, 255, .06); --line: rgba(255, 255, 255, .12);
  --txt: #eef0f8; --mute: #9aa2bc; --hot: #ffd9a0; --on: #f3e6c8; --onTxt: #12131c;
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(14px, env(safe-area-inset-top, 0px)); --gb: max(14px, env(safe-area-inset-bottom, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--txt); font: 400 13px/1.35 var(--ui); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
#view { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
#view canvas { display: block; width: 100%; height: 100%; }

/* the dream's name, top left, like a title card */
#title { position: fixed; left: var(--gl); top: var(--gt); right: 150px; pointer-events: none; text-shadow: 0 2px 18px rgba(0,0,0,.6); transition: opacity .6s; }
#title small { display: block; font: 500 10.5px/1 var(--ui); letter-spacing: .22em; text-transform: uppercase; color: var(--mute); margin-bottom: 7px; }
#title h1 { margin: 0; font: italic 600 clamp(24px, 4.4vw, 40px)/1.02 var(--serif); letter-spacing: -.01em; max-width: 16em; }
#title p { margin: 6px 0 0; font: italic 500 15px/1.3 var(--serif); color: #c9cde0; max-width: 30em; }
.fade #title { opacity: 0; }
.light #title { color: #171a26; text-shadow: 0 1px 14px rgba(255,255,255,.7); } .light #title p { color: #3a3f55; } .light #title small { color: #4a4f66; }
.light #hint { color: rgba(20,22,34,.6); }

/* top right: little round buttons */
#corner { position: fixed; right: var(--gr); top: var(--gt); display: flex; gap: 8px; }
.rb { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: grid; place-items: center; cursor: pointer; font-size: 16px; }
.rb:hover { background: rgba(40, 44, 66, .85); } .rb[aria-pressed="true"] { background: var(--on); color: var(--onTxt); border-color: var(--on); }
.rb svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* the control panel */
#panel { position: fixed; left: var(--gl); right: var(--gr); bottom: var(--gb); margin: 0 auto; max-width: 860px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 12px; box-shadow: 0 18px 50px rgba(0,0,0,.45); transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s; }
.hidden #panel { transform: translateY(calc(100% + 30px)); opacity: 0; pointer-events: none; }
.hidden #title { opacity: 0; }
#bar { display: flex; gap: 8px; align-items: center; }
#gen { flex: none; height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #fff3dc, #f1d9a8); color: #1a1408; font: 600 14px var(--ui); cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 22px rgba(255, 210, 140, .28); }
#gen:active { transform: translateY(1px); }
#gen svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#seedbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 6px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass2); }
#seedbox label { color: var(--mute); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; flex: none; }
#seed { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--txt); font: 500 14px var(--ui); }
.pill { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass2); cursor: pointer; color: var(--txt); font: 500 12.5px var(--ui); white-space: nowrap; }
.pill:hover { background: rgba(255,255,255,.12); }
#more { flex: none; }

#rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; margin-top: 12px; }
.rule b { display: block; font: 500 10.5px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font: 500 12px var(--ui); color: #d6d9e8; white-space: nowrap; }
.seg button:hover { background: rgba(255,255,255,.08); }
.seg button.on { background: var(--on); color: var(--onTxt); border-color: var(--on); }
.seg button:focus-visible, .pill:focus-visible, .rb:focus-visible, #gen:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.collapsed #rules { display: none; }

#toast { position: fixed; left: 50%; top: calc(var(--gt) + 52px); transform: translate(-50%, -8px); background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 8px 14px; border-radius: 999px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#hint { position: fixed; left: 50%; bottom: calc(var(--gb) + 8px); transform: translateX(-50%); color: rgba(255,255,255,.55); font-size: 11.5px; pointer-events: none; opacity: 0; transition: opacity .5s; white-space: nowrap; }
.hidden #hint { opacity: 1; }
#veil { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .5s; }
#veil.on { opacity: 1; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: italic 500 22px var(--serif); color: var(--mute); }

@media (max-width: 720px) {
  #rules { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 10px; }
  #title { right: 140px; } #title p { display: none; }
  #seedbox label { display: none; }
}
@media (max-width: 460px) {
  #panel { padding: 10px; border-radius: 16px; }
  #rules { grid-template-columns: minmax(0, 1fr); max-height: 38vh; overflow-y: auto; }
  #gen { padding: 0 14px; } #gen span { display: none; } #gen { width: 42px; padding: 0; justify-content: center; }
  .seg button { height: 27px; padding: 0 9px; font-size: 11.5px; }
  #corner { gap: 6px; } .rb { width: 34px; height: 34px; }
  #title { right: 130px; } #title h1 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { #panel, #title, #toast, #veil { transition: none; } }
</style>
</head>
<body>
<div id="view" aria-label="The dream. Drag to look around, scroll or pinch to move closer."></div>
<div id="loading">falling asleep…</div>
<div id="veil"></div>
<header id="title" aria-live="polite"><small id="dreamNo">Dream</small><h1 id="dreamName">…</h1><p id="dreamLine"></p></header>
<div id="corner">
  <button class="rb" id="bTour" aria-pressed="true" title="Drift (the camera wanders on its own)" aria-label="Drift"><svg viewBox="0 0 24 24"><path d="M3 12c3-5 6-5 9 0s6 5 9 0"/></svg></button>
  <button class="rb" id="bSound" aria-pressed="false" title="Dream sounds" aria-label="Dream sounds"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9c1.5 1.5 1.5 4.5 0 6"/></svg></button>
  <button class="rb" id="bHide" aria-pressed="false" title="Hide the controls (H)" aria-label="Hide the controls"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<section id="panel" aria-label="Dream controls">
  <div id="bar">
    <button id="gen" title="A new dream (Space)"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg><span>Generate</span></button>
    <div id="seedbox"><label for="seed">Seed</label><input id="seed" maxlength="40" autocomplete="off" spellcheck="false" aria-label="Seed: the same seed and rules always give the same dream"><button class="pill" id="bSurprise" title="Shuffle every rule too">Surprise me</button></div>
    <button class="pill" id="more" aria-expanded="true" aria-controls="rules">Rules ▾</button>
  </div>
  <div id="rules"></div>
</section>
<div id="toast" role="status"></div>
<div id="hint">Drag to look around · press H or the eye to bring the controls back</div>
<script>
/* ---- 10-core.js ---- */
/* ============================================================
   Dream Machine, part 1: the rules of a dream, colour palettes,
   names, and a seeded random number generator so the same seed
   and the same rules always give exactly the same dream.
   ============================================================ */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {   // mulberry32: small, fast, and the same everywhere
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => Math.floor(r.range(lo, hi + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.sign = () => (r() < 0.5 ? -1 : 1);
  return r;
}

/* The six rules, each with its choices. The first choice of each is the default. */
const RULES = [
  { id: 'gravity', name: 'Gravity', opts: [['down', 'Down'], ['up', 'Up'], ['side', 'Sideways'], ['none', 'None'], ['inward', 'Inward']] },
  { id: 'time', name: 'Time', opts: [['slow', 'Slow'], ['still', 'Stopped'], ['normal', 'Normal'], ['fast', 'Fast'], ['back', 'Backwards']] },
  { id: 'scale', name: 'Scale', opts: [['human', 'Human'], ['giant', 'Giant'], ['tiny', 'Tiny'], ['mixed', 'Mixed up']] },
  { id: 'geometry', name: 'Geometry', opts: [['plain', 'Plain'], ['impossible', 'Impossible'], ['echo', 'Echoes'], ['melted', 'Melted'], ['crystal', 'Crystal']] },
  { id: 'palette', name: 'Colour', opts: [['moonlit', 'Moonlit'], ['dusk', 'Dusk'], ['ember', 'Ember'], ['abyss', 'Abyss'], ['verdant', 'Verdant'], ['bleach', 'Bleached'], ['vapor', 'Vapour'], ['random', 'Random']] },
  { id: 'physics', name: 'Physics', opts: [['float', 'Floating'], ['still', 'Still'], ['orbit', 'Orbiting'], ['fall', 'Falling'], ['breathe', 'Breathing']] },
];
const DEFAULT_RULES = Object.fromEntries(RULES.map(r => [r.id, r.opts[0][0]]));
const TIME_SPEED = { still: 0, slow: 0.35, normal: 1, fast: 3.2, back: -1 };

/* Colours: sky top / horizon / below, fog, stone (two tones), the warm light in doorways, moon, mist, specks */
const PALETTES = {
  moonlit: { top: '#0b1224', hor: '#4a5a78', low: '#1a2234', fog: '#3a4862', stone: '#8a8478', stone2: '#5b5f6a', glow: '#ffb35c', moon: '#f4e3b0', moon2: '#cfd6e4', mist: '#9fb0c8', speck: '#dfe8ff', sea: '#232c3e', stars: 1, mood: 'minor' },
  dusk: { top: '#20183a', hor: '#e8907a', low: '#3a2440', fog: '#b0708a', stone: '#c49a86', stone2: '#7a5468', glow: '#ffe2a0', moon: '#ffe9c8', moon2: '#ffb8a8', mist: '#f0b4b0', speck: '#ffe6d0', sea: '#4a2c48', stars: 0.5, mood: 'major' },
  ember: { top: '#0a0405', hor: '#8a2412', low: '#140608', fog: '#4a140e', stone: '#7a5a4e', stone2: '#43302c', glow: '#ff6a1e', moon: '#ff9a4a', moon2: '#ffcf8a', mist: '#a8381e', speck: '#ffb070', sea: '#1a0808', stars: 0.3, mood: 'minor' },
  abyss: { top: '#000208', hor: '#06304a', low: '#000a14', fog: '#04263a', stone: '#2a4a5a', stone2: '#16303c', glow: '#5af0ff', moon: '#b8fff4', moon2: '#5ad0e0', mist: '#1a6a80', speck: '#9af6ff', sea: '#021622', stars: 0.6, mood: 'minor' },
  verdant: { top: '#1a3a48', hor: '#a8c8a0', low: '#24402e', fog: '#7aa088', stone: '#a8a088', stone2: '#5a7a58', glow: '#fff0a0', moon: '#fffbe0', moon2: '#e0f0d0', mist: '#c8e0c0', speck: '#f0ffd8', sea: '#2e5040', stars: 0.15, mood: 'major' },
  bleach: { top: '#aab0bc', hor: '#f0eee9', low: '#d8d6d0', fog: '#e6e3dd', stone: '#ece8e0', stone2: '#8c8a84', glow: '#2a2a2a', moon: '#1a1a1a', moon2: '#5a5a5a', mist: '#ffffff', speck: '#6a6a6a', sea: '#cfccc5', stars: 0, mood: 'sus', light: true, fogK: 0.55 },
  vapor: { top: '#14082e', hor: '#ff6ac8', low: '#2a0a40', fog: '#7a3a9a', stone: '#6ad8e8', stone2: '#b85ad8', glow: '#ffe86a', moon: '#ffb0e8', moon2: '#8af0ff', mist: '#ff9ae0', speck: '#ffffff', sea: '#3a1060', stars: 0.8, mood: 'major' },
};
/* "Random" mixes a palette from scratch, still keeping it readable: a dark or light sky, and stone that stands out from it */
function randomPalette(r) {
  const h = r() * 360, h2 = (h + r.range(120, 240)) % 360, dark = r.chance(0.75), c = (H, S, L) => new THREE.Color().setHSL(((H % 360) + 360) % 360 / 360, S, L).getStyle();
  return dark
    ? { top: c(h, 0.5, 0.06), hor: c(h + 20, 0.45, 0.42), low: c(h, 0.4, 0.1), fog: c(h + 20, 0.35, 0.28), stone: c(h2, 0.25, 0.55), stone2: c(h2, 0.2, 0.32), glow: c(h2 + 30, 0.95, 0.65), moon: c(h2 + 10, 0.6, 0.86), moon2: c(h + 40, 0.4, 0.8), mist: c(h + 20, 0.4, 0.62), speck: c(h2, 0.6, 0.88), sea: c(h, 0.4, 0.14), stars: 0.8, mood: r.pick(['minor', 'major', 'sus']) }
    : { light: true, fogK: 0.6, top: c(h, 0.4, 0.62), hor: c(h + 15, 0.5, 0.86), low: c(h, 0.3, 0.7), fog: c(h + 15, 0.35, 0.8), stone: c(h2, 0.3, 0.86), stone2: c(h2, 0.25, 0.6), glow: c(h2 + 30, 0.9, 0.3), moon: c(h2, 0.5, 0.3), moon2: c(h, 0.3, 0.45), mist: c(h + 15, 0.4, 0.95), speck: c(h2, 0.5, 0.4), sea: c(h, 0.3, 0.74), stars: 0, mood: r.pick(['major', 'sus']) };
}

/* A name for each dream: "The Patient Lighthouse at Low Tide" */
const NAME_A = ['Drowned', 'Patient', 'Hollow', 'Upside-Down', 'Forgotten', 'Humming', 'Weightless', 'Borrowed', 'Sleeping', 'Endless', 'Quiet', 'Second', 'Inside-Out', 'Unfinished', 'Lantern-Lit', 'Paper', 'Salt-White', 'Last', 'Folded', 'Echoing'];
const NAME_N = ['Staircase', 'Lighthouse', 'Door', 'Harbour', 'Archive', 'Bell Tower', 'Garden', 'Observatory', 'Cathedral', 'Hallway', 'Clockworks', 'Aqueduct', 'Library', 'Station', 'Window', 'Orchard', 'Theatre', 'Bridge', 'Waiting Room', 'Well'];
const NAME_C = ['at Low Tide', 'of the Third Moon', 'on a Tuesday', 'Nobody Built', 'Above the Fog', 'Under Your Old School', 'Before the Last Train', 'of Salt and Rain', 'at the End of the Hall', 'Where the Stairs Give Up', 'of Slow Light', 'in the Year Without Summer', 'You Have Been Before', 'Past the Edge of the Map', 'That Hums at Night'];
const LINES = {
  gravity: { down: '', up: 'Everything hangs from the sea above.', side: 'The world has fallen on its side.', none: 'Nothing here remembers which way is down.', inward: 'It is a world small enough to walk around.' },
  time: { still: 'Time has stopped. Nothing minds.', back: 'Time is running backwards.', fast: 'The hours go by like birds.', slow: '', normal: '' },
  scale: { giant: 'The buildings are enormous.', tiny: 'You are a giant here.', mixed: 'Nothing is the size it should be.', human: '' },
  geometry: { impossible: 'The architecture does not quite agree with itself.', echo: 'Every shape repeats, smaller and smaller.', melted: 'The stone is soft and slowly sliding.', crystal: 'Everything has edges.', plain: '' },
};
function dreamName(r) { return `The ${r.pick(NAME_A)} ${r.pick(NAME_N)} ${r.pick(NAME_C)}`; }
const SEED_WORDS = ['moth', 'tide', 'lantern', 'salt', 'velvet', 'ember', 'cello', 'quartz', 'harbor', 'sleep', 'comet', 'ivory', 'nocturne', 'willow', 'static', 'marble', 'echo', 'drift', 'hollow', 'paper'];
function newSeed() { const r = rng((Math.random() * 4294967296) >>> 0); return r.pick(SEED_WORDS) + '-' + r.pick(SEED_WORDS) + '-' + r.int(10, 99); }

/* ---- textures, painted once on canvases ---- */
const Tex = {
  /* weathered stone: soft blotches and thin horizontal strata, greyscale so each material can tint it */
  stone() {
    if (this._stone) return this._stone;
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), r = rng(7);
    g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 1400; i++) { const v = r.int(150, 235), s = r.range(2, 18); g.fillStyle = `rgba(${v},${v},${v},${r.range(0.08, 0.3)})`; g.beginPath(); g.arc(r() * 256, r() * 256, s, 0, 7); g.fill(); }
    for (let y = 0; y < 256; y += r.int(4, 14)) { g.fillStyle = `rgba(60,60,60,${r.range(0.08, 0.22)})`; g.fillRect(0, y, 256, r.range(1, 2.4)); }
    for (let i = 0; i < 2600; i++) { const v = r.int(80, 255); g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(r() * 256, r() * 256, 1, 1); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return (this._stone = t);
  },
  /* a soft round glow: for moons, mist and lights */
  glow() {
    if (this._glow) return this._glow;
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)'); gr.addColorStop(0.6, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return (this._glow = new THREE.CanvasTexture(c));
  },
  /* a wide, flat bank of mist */
  mist() {
    if (this._mist) return this._mist;
    const c = document.createElement('canvas'); c.width = 256; c.height = 128; const g = c.getContext('2d'), r = rng(11);
    for (let i = 0; i < 60; i++) { const x = r.range(40, 216), y = r.range(44, 84), s = r.range(18, 46), gr = g.createRadialGradient(x, y, 0, x, y, s); gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 128); }
    return (this._mist = new THREE.CanvasTexture(c));
  },
  /* a moon: craters and maria, lit from one side */
  moon(seed) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 9; i++) { const x = r() * 256, y = r() * 256, s = r.range(20, 70), gr = g.createRadialGradient(x, y, 0, x, y, s); gr.addColorStop(0, 'rgba(120,120,130,.35)'); gr.addColorStop(1, 'rgba(120,120,130,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); }
    for (let i = 0; i < 70; i++) { const x = r() * 256, y = r() * 256, s = r.range(1.5, 9); g.fillStyle = 'rgba(90,90,100,.28)'; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(x - s * 0.25, y - s * 0.25, s * 0.7, 0, 7); g.fill(); }
    return new THREE.CanvasTexture(c);
  },
};
/* ---- 20-shapes.js ---- */
/* ============================================================
   Dream Machine, part 2: the building blocks. Islands, spires,
   rings, stairs, doors, towers, clocks, a tiny person. Each one is
   built with its base at y = 0 and grows upward; the world (part 3)
   decides where it goes. The Geometry rule reshapes them here:
   Crystal makes them faceted, Melted makes the stone sag.
   ============================================================ */
const Shapes = {

  },
  zoom(f) { const s = World.info.size, inward = this.rules.gravity === 'inward'; this.cam.dist = clamp(this.cam.dist * f, s * (inward ? 1.1 : 0.12), s * (inward ? 6 : 3.5)); },
  placeCamera(realDt) {
    const C = this.cam, cam = this.camera;
    if (this.tour && performance.now() - this.idleAt > 2500 && !calm()) { C.theta += realDt * 0.035; C.phi = clamp(C.phi + Math.sin(performance.now() / 9000) * realDt * 0.01, 0.15, Math.PI - 0.15); }

    cam.lookAt(C.look);
  },
  /* ---- the controls ---- */
  ui() {
    const box = $('#rules');
    for (const R of RULES) {
      const seg = h('div.seg', { role: 'radiogroup', 'aria-label': R.name });
      for (const [v, label] of R.opts) { const b = h('button', { type: 'button', role: 'radio', 'data-r': R.id, 'data-v': v }, label); b.onclick = () => this.setRule(R.id, v); seg.append(b); }
      box.append(h('div.rule', h('b', R.name), seg));
    }
    const acts = h('div.rule', { style: 'grid-column: 1 / -1' }, h('b', 'Keep this dream'), h('div.seg', { id: 'acts' }));
    box.append(acts);
    const act = (label, fn, title) => { const b = h('button', { type: 'button', title }, label); b.onclick = fn; $('#acts').append(b); return b; };
    act('Save picture', () => this.savePicture(), 'Download this view as a PNG');
    act('Copy link', () => this.copyLink(), 'A link that opens this exact dream');
    if (this.burnware()) act('Set as wallpaper', () => this.wallpaper(), 'Make this view the Burnware desktop wallpaper');
    $('#gen').onclick = () => this.dream();
    $('#bSurprise').onclick = () => this.surprise();
    $('#more').onclick = () => { const p = $('#panel'), c = p.classList.toggle('collapsed'); $('#more').setAttribute('aria-expanded', String(!c)); $('#more').textContent = c ? 'Rules ▴' : 'Rules ▾'; try { localStorage.setItem('dream-rules', c ? '0' : '1'); } catch (e) {} };
    let open = false; try { open = localStorage.getItem('dream-rules') === '1'; } catch (e) {}
    if (!open) $('#more').onclick();
    $('#bHide').onclick = () => this.toggleHide();
    $('#bTour').onclick = () => { this.tour = !this.tour; $('#bTour').setAttribute('aria-pressed', String(this.tour)); try { localStorage.setItem('dream-tour', this.tour ? '1' : '0'); } catch (e) {} this.toast(this.tour ? 'The camera will drift when you let go' : 'The camera stays where you put it'); };
    $('#bSound').onclick = () => { const on = Sound.toggle(); $('#bSound').setAttribute('aria-pressed', String(on)); this.toast(on ? 'Dream sounds on' : 'Dream sounds off'); };
  },
  paintRules() { document.querySelectorAll('#rules .seg button[data-r]').forEach(b => { const on = this.rules[b.dataset.r] === b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); }); },
  setRule(id, v) {
    if (this.rules[id] === v) return; this.rules[id] = v; this.paintRules();
    if (id === 'time' || id === 'physics') {   // these change how the dream moves, not what is in it
      try { history.replaceState(null, '', '#' + new URLSearchParams(Object.assign({ seed: this.seed }, this.rules)).toString()); } catch (e) {}
      const lines = ['gravity', 'scale', 'geometry', 'time'].map(k => LINES[k][this.rules[k]]).filter(Boolean); $('#dreamLine').textContent = lines.slice(0, 2).join(' ');
      return this.toast(id === 'time' ? { still: 'Time stops', slow: 'Time slows down', normal: 'Time runs normally', fast: 'Time speeds up', back: 'Time runs backwards' }[v] : { still: 'Everything holds still', float: 'Everything floats', orbit: 'The islands start to orbit', fall: 'Everything falls, forever', breathe: 'The world breathes' }[v]);
    }
    const keepCam = { theta: this.cam.theta }; this.dream(this.seed, null, true); this.cam.theta = keepCam.theta;
  },
  toggleHide() { const on = document.body.classList.toggle('hidden'); $('#bHide').setAttribute('aria-pressed', String(on)); },
  toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(this.toastT); this.toastT = setTimeout(() => t.classList.remove('show'), 1800); },
  /* ---- keeping a dream ---- */
  snapshot(maxW) {
    this.renderer.render(this.scene, this.camera);
    const src = this.renderer.domElement; if (!maxW || src.width <= maxW) return src;
    const c = document.createElement('canvas'), k = maxW / src.width; c.width = maxW; c.height = Math.round(src.height * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
  },
  savePicture() {
    const c = this.snapshot(), name = 'dream-' + this.seed.replace(/[^a-z0-9-]/gi, '') + '.png';
    c.toBlob((b) => { if (!b) return this.toast('Could not save the picture'); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); this.toast('Saved ' + name); }, 'image/png');
  },
  copyLink() {
    let url = location.href; try { if (this.burnware()) url = new URL('apps/dream-machine.html' + location.hash, parent.location.href).href; } catch (e) {}
    const done = () => this.toast('Link copied: it opens this exact dream');
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => this.toast(url)); else this.toast(url);
  },
  burnware() { try { return window.parent !== window && !!parent.BW && !!parent.BW.Wall; } catch (e) { return false; } },
  wallpaper() {
    try {
      const P = parent.BW, data = this.snapshot(1600).toDataURL('image/jpeg', 0.85);
      P.Store.data.customWall = data; P.Store.data.wall = 'custom'; P.Store.save(); P.Wall.paint();
      this.toast('This dream is now your desktop wallpaper');
    } catch (e) { this.toast('Could not set the wallpaper (not enough room to save it)'); }
  },
  /* ---- every frame ---- */
  frame(now) {
    requestAnimationFrame((n) => this.frame(n));
    const real = Math.min(0.05, this.last ? (now - this.last) / 1000 : 0); this.last = now;
    if (document.hidden || !World.root) return;
    const dt = real * TIME_SPEED[this.rules.time]; this.t += dt;
    Motion.update(this.t, dt); this.placeCamera(real);
    this.renderer.render(this.scene, this.camera);
  },
};
/* a tiny element helper: h('div.cls#id', {attrs}, ...children) */
function h(tag, props, ...kids) {
  const [, name = 'div', rest = ''] = tag.match(/^([a-z0-9]*)(.*)$/i), el = document.createElement(name);
  for (const part of rest.match(/[.#][^.#]+/g) || []) part[0] === '.' ? el.classList.add(part.slice(1)) : (el.id = part.slice(1));
  if (props && (typeof props !== 'object' || props instanceof Node || Array.isArray(props))) { kids.unshift(props); props = null; }
  for (const k in props || {}) el.setAttribute(k, props[k]);
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
}

/* ---- dream sounds: a slow, soft chord, with wind under it. Off until you ask. ---- */
const Sound = {
  ctx: null, on: false, voices: [], mood: 'minor', root: 0,
  toggle() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; } this.build(); }
    this.on = !this.on; const g = this.master.gain, t = this.ctx.currentTime;
    if (this.on) this.ctx.resume();
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(this.on ? 0.16 : 0, t + 1.5);
    return this.on;
  },
  build() {
    const c = this.ctx; this.master = c.createGain(); this.master.gain.value = 0; this.master.connect(c.destination);
    this.filter = c.createBiquadFilter(); this.filter.type = 'lowpass'; this.filter.frequency.value = 900; this.filter.Q.value = 0.6; this.filter.connect(this.master);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 420; lfo.connect(lg); lg.connect(this.filter.frequency); lfo.start();
    for (let i = 0; i < 4; i++) for (const det of [-7, 6]) { const o = c.createOscillator(), g = c.createGain(); o.type = i === 0 ? 'triangle' : 'sawtooth'; o.detune.value = det; g.gain.value = i === 0 ? 0.32 : 0.09; o.connect(g); g.connect(this.filter); o.start(); this.voices.push({ o, i }); }
    const n = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), bp = c.createBiquadFilter(), wg = c.createGain(); src.buffer = n; src.loop = true; bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.8; wg.gain.value = 0.05; src.connect(bp); bp.connect(wg); wg.connect(this.master); src.start();
    const wl = c.createOscillator(), wlg = c.createGain(); wl.frequency.value = 0.05; wlg.gain.value = 300; wl.connect(wlg); wlg.connect(bp.frequency); wl.start();
    this.retune(this.mood, this.root); setInterval(() => this.step(), 9000);
  },
  retune(mood, seed) { this.mood = mood; this.root = 45 + (seed % 8); this.chord = 0; this.apply(1.5); },
  step() { if (!this.on) return; this.chord = (this.chord + 1) % 4; this.apply(4); },
  apply(glide) {
    if (!this.ctx) return;
    const shapes = { minor: [0, 3, 7, 10], major: [0, 4, 7, 11], sus: [0, 5, 7, 14] }, sh = shapes[this.mood] || shapes.minor, moves = [0, -4, 3, -2], base = this.root + moves[this.chord], t = this.ctx.currentTime;
    for (const v of this.voices) { const midi = base + (v.i === 0 ? -12 : sh[v.i] + (v.i === 3 ? 0 : 0)), f = 440 * Math.pow(2, (midi - 69) / 12); v.o.frequency.cancelScheduledValues(t); v.o.frequency.setValueAtTime(v.o.frequency.value, t); v.o.frequency.exponentialRampToValueAtTime(f, t + glide); }
  },
};
/* ---- 99-main.js ---- */
/* ============================================================
   Dream Machine: start-up. Open the dream in the link if there is
   one (so shared links work), otherwise a new one.
   ============================================================ */
(function start() {
  if (typeof THREE === 'undefined') { $('#loading').textContent = 'The dream needs a connection to load (three.js could not be reached).'; return; }
  App.init();
  const q = new URLSearchParams(location.hash.slice(1)), rules = {};
  for (const R of RULES) { const v = q.get(R.id); if (v && R.opts.some(o => o[0] === v)) rules[R.id] = v; }
  App.dream(q.get('seed') || newSeed(), rules);
  requestAnimationFrame((n) => App.frame(n));
})();
