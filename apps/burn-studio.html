<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Burn Studio: a music maker. Drums, bass, keys and synths, loops, a piano and WAV export.">
<meta name="theme-color" content="#5c1408">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Burn Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Burn Studio: a groovebox you can poke at. Charcoal hardware panels, an LCD for the clock, step buttons
   coloured in fours like an old drum machine, and a playing surface at the bottom for thumbs.
   One deliberate dark look; every size is fluid so it works in a small window and on a phone. */
:root {
  color-scheme: dark;
  --bg: #121317; --panel: #1d1f25; --panel2: #262931; --edge: #33363f; --edge2: #464a55; --txt: #ece9e1; --mute: #8f93a0;
  --acc: #ff8a1f; --acc2: #ffb35a; --lcd: #c8f560; --lcdbg: #18210d;
  --c-drums: #ff5d4a; --c-bass: #ffb020; --c-keys: #3fc7ff; --c-synth: #b56cff;
  --ui: "Chakra Petch", "Arial Narrow", system-ui, sans-serif; --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  --gl: max(10px, env(safe-area-inset-left, 0px)); --gr: max(10px, env(safe-area-inset-right, 0px)); --gb: max(8px, env(safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--txt); font: 600 13px/1.25 var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; }
select { font: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 6px; padding: 6px var(--gr) var(--gb) var(--gl); }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 0 rgba(0,0,0,.4); }
.btn { border: 1px solid var(--edge2); background: linear-gradient(#30333c, #24262d); border-radius: 6px; padding: 6px 10px; min-height: 32px; letter-spacing: .04em; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.5); white-space: nowrap; }
.btn:active, .btn.on { background: linear-gradient(#22242a, #2b2e36); box-shadow: inset 0 2px 4px rgba(0,0,0,.6); }
.btn.on { color: var(--acc); border-color: var(--acc); }
.btn.big { min-width: 44px; font-size: 16px; }
.btn.rec.on { color: #fff; background: #c42b1f; border-color: #ff6a5e; animation: recpulse 1s ease-in-out infinite alternate; }
.btn.play.on { color: #0c1206; background: var(--lcd); border-color: #e6ff9e; }
@keyframes recpulse { to { box-shadow: 0 0 12px rgba(255,60,40,.7); } }
/* transport */
#top { display: flex; align-items: center; gap: 6px; padding: 6px; flex-wrap: wrap; }
.lcd { font: 18px/1 var(--mono); color: var(--lcd); background: var(--lcdbg); border: 1px solid #2c3a17; border-radius: 4px; padding: 6px 10px; min-width: 0; flex: 1 1 210px; display: flex; gap: 14px; align-items: baseline; white-space: nowrap; overflow: hidden; text-shadow: 0 0 6px rgba(200,245,96,.45); background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
.lcd small { font-size: 11px; opacity: .7; }
.knob { display: flex; align-items: center; gap: 3px; }
.knob .btn { min-width: 32px; padding: 6px 0; }
.knob span { font: 15px var(--mono); min-width: 3.1em; text-align: center; color: var(--acc2); }
.lbl { font-size: 10px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
/* scenes and tracks */
#mid { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
#scenes { display: flex; gap: 4px; padding: 5px; align-items: center; }
#scenes .sc { width: 40px; height: 34px; border-radius: 6px; border: 1px solid var(--edge2); background: var(--panel2); font-size: 15px; position: relative; }
#scenes .sc.has::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: var(--acc); opacity: .7; }
#scenes .sc.sel { border-color: var(--acc); color: var(--acc); background: #2d2619; }
#scenes .sc.playing { box-shadow: 0 0 0 2px var(--lcd); }
#tracks { display: flex; gap: 4px; padding: 5px; flex: 1 1 320px; overflow-x: auto; }
.trk { flex: 1 0 128px; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; gap: 2px 6px; align-items: center; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--edge2); background: var(--panel2); text-align: left; position: relative; }
.trk.sel { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, var(--panel2)); }
.trk .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); grid-row: 1; }
.trk .nm { font-weight: 700; letter-spacing: .05em; }
.trk .ms { display: flex; gap: 3px; grid-row: 1; grid-column: 3; }
.trk .ms b { font-size: 10px; width: 20px; height: 18px; display: grid; place-items: center; border-radius: 3px; border: 1px solid var(--edge2); color: var(--mute); }
.trk .ms b.on.m { background: #6a2a20; color: #ffb4a8; border-color: #ff6a5e; } .trk .ms b.on.s { background: #5a4a10; color: #ffe27a; border-color: #ffd23a; }
.trk .pre { grid-column: 1 / 3; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk .vu { grid-column: 3; height: 4px; width: 46px; border-radius: 2px; background: #111; overflow: hidden; }
.trk .vu i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lcd), var(--acc) 70%, #ff4a3a); }
/* the editor */
#edit { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; padding: 6px; gap: 6px; }
#edbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#edbar .grow { flex: 1; }
.seg { display: flex; border: 1px solid var(--edge2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel2); padding: 5px 9px; min-height: 30px; color: var(--mute); }
.seg button + button { border-left: 1px solid var(--edge2); }
.seg button.on { background: #2d2619; color: var(--acc); }
#gridwrap { overflow: auto; min-height: 0; border-radius: 6px; background: #15161a; border: 1px solid var(--edge); position: relative; }
#grid { display: grid; grid-template-columns: 52px repeat(16, minmax(20px, 1fr)); gap: 2px; padding: 4px; min-width: 380px; position: relative; touch-action: none; }
.rowlbl { font: 11px var(--mono); color: var(--mute); display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; white-space: nowrap; overflow: hidden; }
.rowlbl.root { color: var(--txt); }
.cell { height: 26px; border-radius: 4px; background: #23252c; position: relative; }
.cell.beat { background: #2a2c34; }
.cell.rootrow { background: #262a24; } .cell.rootrow.beat { background: #2d3229; }
.cell.on { background: var(--tc); box-shadow: 0 0 8px color-mix(in srgb, var(--tc) 60%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
.cell.head { box-shadow: inset 0 0 0 2px rgba(255,255,255,.75) !important; }
.note { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 4px; background: var(--tc); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 8px color-mix(in srgb, var(--tc) 55%, transparent); pointer-events: none; z-index: 1; }
.steprow { display: contents; }
.stepnum { font: 10px var(--mono); text-align: center; padding-bottom: 2px; color: var(--mute); }
.stepnum.q1 { color: #ff6b5e; } .stepnum.q2 { color: #ffa24a; } .stepnum.q3 { color: #ffd84a; } .stepnum.q4 { color: #efe9d8; }
/* the playing surface */
#play { padding: 6px; display: grid; gap: 6px; }
#playbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#surface { height: clamp(120px, 26vh, 210px); position: relative; touch-action: none; }
.keys { position: absolute; inset: 0; display: flex; }
.key { flex: 1; position: relative; background: linear-gradient(#f7f4ea, #e4dfd1); border: 1px solid #8f8a7e; border-radius: 0 0 6px 6px; margin: 0 1px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font: 11px var(--mono); color: #6b675e; }
.key.down { background: linear-gradient(#ffd49a, #ffb35a); }
.key.black { position: absolute; top: 0; height: 60%; width: 0; z-index: 2; background: linear-gradient(#2c2d33, #101114); border-color: #000; color: #888; padding: 0; margin: 0; }
.key.black.down { background: linear-gradient(#a85a12, #6a3a08); }
.key.inscale::after { content: ""; position: absolute; top: 8px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--tc); opacity: .8; }
.pads { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; }
.pad { border-radius: 10px; border: 1px solid #000; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--pc) 55%, #fff 10%), color-mix(in srgb, var(--pc) 70%, #000) 75%); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 3px 0 rgba(0,0,0,.6); display: grid; place-items: center; font-weight: 700; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.pad.down { filter: brightness(1.35); transform: translateY(2px); box-shadow: inset 0 2px 8px rgba(0,0,0,.4), 0 1px 0 rgba(0,0,0,.6); }
.chords { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; }
.chord { border-radius: 8px; border: 1px solid var(--edge2); background: linear-gradient(#34373f, #25272e); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 3px 0 rgba(0,0,0,.5); }
.chord small { font: 11px var(--mono); color: var(--mute); }
.chord.down { background: color-mix(in srgb, var(--tc) 45%, #25272e); transform: translateY(2px); }
/* menus and messages */
.menu { position: fixed; z-index: 20; min-width: 200px; padding: 4px; background: #24262d; border: 1px solid var(--edge2); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); display: grid; gap: 2px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 9px 12px; border-radius: 5px; }
.menu button:hover, .menu button:focus-visible { background: #34373f; }
.menu hr { border: 0; border-top: 1px solid var(--edge); margin: 3px 0; width: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(var(--gb) + 16px); transform: translateX(-50%); background: #2d2619; color: var(--acc2); border: 1px solid var(--acc); padding: 8px 14px; border-radius: 8px; z-index: 30; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; }
.sheet { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.sheet .panel { padding: 14px; max-width: 420px; width: 100%; display: grid; gap: 10px; }
.sheet h3 { margin: 0; font-size: 16px; letter-spacing: .06em; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sheet textarea { width: 100%; height: 80px; background: #111; color: var(--lcd); border: 1px solid var(--edge2); border-radius: 6px; font: 12px var(--mono); padding: 8px; user-select: text; -webkit-user-select: text; }
.sel { background: var(--panel2); color: var(--txt); border: 1px solid var(--edge2); border-radius: 6px; padding: 5px 6px; min-height: 30px; }
/* narrow windows and phones: track list becomes tabs, the grid takes the middle */
@media (max-width: 640px) {
  #app { gap: 5px; padding-top: 5px; }
  #top { gap: 4px; padding: 5px; }
  .lcd { order: -1; flex-basis: 100%; font-size: 16px; }
  .knob .lbl { display: none; }
  #tracks { flex-basis: 100%; }
  .trk { flex: 1 0 100px; grid-template-columns: auto 1fr; padding: 4px 6px; }
  .trk .ms { grid-column: 1 / 3; grid-row: 3; }
  .trk .vu { display: none; }
  #grid { grid-template-columns: 38px repeat(16, minmax(18px, 1fr)); min-width: 0; }
  .cell { height: 22px; }
  #surface { height: clamp(110px, 24vh, 170px); }
}
/* nothing may push the page wider than the screen: the strips scroll inside themselves instead */
#app { grid-template-columns: minmax(0, 1fr); }
#app > *, #mid > * { min-width: 0; }
@media (max-width: 640px) { .trk { flex: 1 1 0; min-width: 0; } .lcd { font-size: 14px; gap: 10px; } #edbar input[type=range] { width: 64px !important; } }
@media (prefers-reduced-motion: reduce) { .btn.rec.on { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="top" class="panel">
    <button class="btn big play" id="bPlay" aria-label="Play">▶</button>
    <button class="btn big" id="bStop" aria-label="Stop">■</button>
    <button class="btn big rec" id="bRec" aria-label="Record" title="Record what you play into the selected track">●</button>
    <div class="lcd" id="lcd" aria-live="off"><span id="lcdPos">1.1.1</span><span id="lcdBpm">92 BPM</span><span id="lcdKey">A minor</span><small id="lcdScene">SCENE A</small></div>
    <div class="knob"><span class="lbl">Tempo</span><button class="btn" id="bpmDn" aria-label="Slower">−</button><span id="bpmVal">92</span><button class="btn" id="bpmUp" aria-label="Faster">+</button></div>
    <button class="btn" id="bMetro" title="Metronome">♩ Click</button>
    <button class="btn" id="bMenu" aria-haspopup="menu">☰ Song</button>
  </div>
  <div id="mid">
    <div id="scenes" class="panel" role="group" aria-label="Scenes"></div>
    <div id="tracks" class="panel" role="group" aria-label="Tracks"></div>
  </div>
  <div id="edit" class="panel">
    <div id="edbar"></div>
    <div id="gridwrap"><div id="grid" role="grid" aria-label="Pattern"></div></div>
  </div>
  <div id="play" class="panel">
    <div id="playbar"></div>
    <div id="surface"></div>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
/* ---- 10-core.js ---- */
/* ============================================================
   Burn Studio: the song. Four tracks (drums, bass, keys, synth),
   four scenes (A to D, each a loop of 1, 2 or 4 bars), notes on a
   16th-note grid, a key and a scale, and a demo groove so there is
   something playing the moment you press play.
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h(tag, props, ...kids) {
  const m = tag.split(/(?=[.#])/), el = document.createElement(m[0] || 'div');
  for (const p of m.slice(1)) { if (p[0] === '.') el.classList.add(p.slice(1)); else el.id = p.slice(1); }
  if (props && (typeof props !== 'object' || props instanceof Node || Array.isArray(props))) { kids.unshift(props); props = null; }
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(9)) if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = (m) => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const SCALES = {
  major: { name: 'major', steps: [0, 2, 4, 5, 7, 9, 11] }, minor: { name: 'minor', steps: [0, 2, 3, 5, 7, 8, 10] },
  dorian: { name: 'dorian', steps: [0, 2, 3, 5, 7, 9, 10] }, mixo: { name: 'mixolydian', steps: [0, 2, 4, 5, 7, 9, 10] },
  pent: { name: 'pentatonic', steps: [0, 2, 4, 7, 9] }, mpent: { name: 'minor pent.', steps: [0, 3, 5, 7, 10] }, blues: { name: 'blues', steps: [0, 3, 5, 6, 7, 10] },
};
const KINDS = {
  drums: { name: 'Drums', color: 'var(--c-drums)', presets: ['808', 'Studio', 'Lo-fi'] },
  bass: { name: 'Bass', color: 'var(--c-bass)', presets: ['Sub', 'Pluck', 'Acid'], low: 33 },
  keys: { name: 'Keys', color: 'var(--c-keys)', presets: ['E-Piano', 'Organ', 'Piano'], low: 52 },
  synth: { name: 'Synth', color: 'var(--c-synth)', presets: ['Lead', 'Pad', 'Chip'], low: 64 },
};
const LANES = [['Kick', '#ff5d4a'], ['Snare', '#ff9a3a'], ['Clap', '#ffd23a'], ['Closed hat', '#8ee05a'], ['Open hat', '#3fd1a8'], ['Low tom', '#3fc7ff'], ['High tom', '#6f8cff'], ['Crash', '#c98cff']];
/* the rows a melodic track shows: two octaves of the scale, from its lowest note up */
function scaleRows(kind, song) {
  const K = KINDS[kind], sc = SCALES[song.scale].steps, root = song.key, rows = [];
  let base = K.low - ((K.low - root) % 12 + 12) % 12;   // the key's root at or below the track's low note
  for (let o = 0; o < 2; o++) for (const s of sc) rows.push(base + o * 12 + s);
  rows.push(base + 24);
  return rows.filter(m => m >= K.low - 2).reverse();
}
const inScale = (m, song) => SCALES[song.scale].steps.includes(((m - song.key) % 12 + 12) % 12);
/* chords on the scale's degrees, stacked in thirds (pentatonic and blues borrow the parent scale) */
function chordSet(song) {
  const parent = ['minor', 'dorian', 'mpent', 'blues'].includes(song.scale) ? (song.scale === 'dorian' ? SCALES.dorian : SCALES.minor) : (song.scale === 'mixo' ? SCALES.mixo : SCALES.major);
  const sc = parent.steps, out = [], ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  for (let d = 0; d < 7; d++) {
    const tones = [0, 2, 4].map(k => sc[(d + k) % 7] + (d + k >= 7 ? 12 : 0));
    const third = tones[1] - tones[0], fifth = tones[2] - tones[0], minor = third === 3, dim = minor && fifth === 6;
    const rootPc = (song.key + sc[d]) % 12;
    out.push({ deg: d, roman: (minor ? ROMAN[d].toLowerCase() : ROMAN[d]) + (dim ? '°' : ''), name: NOTE_NAMES[rootPc] + (dim ? 'dim' : minor ? 'm' : ''), tones: tones.map(t => song.key + t) });
  }
  const V = out[4]; out.push({ deg: 7, roman: V.roman.toUpperCase() + '7', name: NOTE_NAMES[(song.key + 7) % 12] + '7', tones: [song.key + 7, song.key + 11, song.key + 14, song.key + 17] });
  return out;
}
/* ---------- the song ---------- */
const SCENES = 4;
function emptySong() {
  return { v: 1, title: 'Untitled jam', bpm: 92, swing: 0.12, key: 9, scale: 'minor', bars: 2, metro: false, chain: false,
    tracks: ['drums', 'bass', 'keys', 'synth'].map(kind => ({ kind, preset: KINDS[kind].presets[0], vol: kind === 'drums' ? 0.9 : 0.75, mute: false, solo: false, rev: kind === 'keys' || kind === 'synth' ? 0.25 : 0.06, pats: Array.from({ length: SCENES }, () => []) })) };
}
const N = (s, n, l = 1, v = 0.9) => ({ s, n, l, v });
function demoSong() {
  const S = emptySong(); S.title = 'Rain on the garage roof';
  const [D, B, K, Y] = S.tracks;
  // scene A: a laid-back groove in A minor (Am, F, C, G)
  const kick = [0, 7, 10, 16, 23, 26], snare = [4, 12, 20, 28], hats = [...Array(32).keys()].filter(i => i % 2 === 0);
  D.pats[0] = [...kick.map(s => N(s, 0)), ...snare.map(s => N(s, 1, 1, 0.85)), ...hats.map(s => N(s, 3, 1, s % 4 ? 0.45 : 0.7)), N(14, 4, 1, 0.5), N(30, 4, 1, 0.5)];
  const roots = [45, 41, 36, 43];   // A2 F2 C2 G2
  B.pats[0] = roots.flatMap((r, i) => [N(i * 8, r, 3), N(i * 8 + 3, r, 1, 0.7), N(i * 8 + 6, r + 12, 2, 0.6)]);
  const chords = [[57, 60, 64], [57, 60, 65], [55, 60, 64], [55, 59, 62]];
  K.pats[0] = chords.flatMap((c, i) => c.flatMap(n => [N(i * 8, n, 3, 0.6), N(i * 8 + 4, n, 2, 0.45)]));
  Y.pats[0] = [N(2, 76, 2), N(4, 72, 2), N(6, 74, 4, 0.8), N(12, 72, 2, 0.7), N(18, 71, 2), N(20, 72, 2), N(22, 74, 6, 0.8)];
  // scene B: busier drums, a new melody on top
  D.pats[1] = [...kick.map(s => N(s, 0)), N(15, 0, 1, 0.6), ...snare.map(s => N(s, 1, 1, 0.9)), N(12, 2, 1, 0.6), N(28, 2, 1, 0.6), ...[...Array(32).keys()].map(s => N(s, 3, 1, s % 2 ? 0.35 : 0.6)), N(0, 7, 1, 0.5), N(29, 5, 1, 0.7), N(30, 6, 1, 0.7), N(31, 5, 1, 0.7)];

      const lo = KINDS[t.kind].low, tones = c.tones.map(m => { let v = m; while (v < lo + (t.kind === 'bass' ? 0 : 3)) v += 12; while (v > lo + 19) v -= 12; return v; });
      return t.kind === 'bass' ? [tones[0], tones[0] + 12] : tones.sort((a, b) => a - b);
    };
    set.forEach((c, k) => box.append(h('div.chord', { 'data-k': k, role: 'button', 'aria-label': c.name + ' chord' }, c.name, h('small', c.roman))));
    this.fingers(box, (e) => this.under(e, '.chord'), (el, id) => { el.classList.add('down'); voice(set[+el.dataset.k]).forEach((m, j) => Live.on('c' + id + ':' + j, i, m, 0.7)); }, (el, id) => { el.classList.remove('down'); for (let j = 0; j < 5; j++) Live.off('c' + id + ':' + j); });
    return box;
  },
};
/* ---- 60-extras.js ---- */
/* ============================================================
   Extras: a library of ready-made loops for every track (always in
   your key and scale), playing from the computer keyboard, a link
   that carries the whole song, and WAV export (rendered offline by
   the same engine, faster than real time).
   ============================================================ */
/* ---------- the loop library ---------- */
const Loops = {
  /* scale degree d (0 = the key's root) in the track's register, plus whole octaves */
  deg(song, kind, d, oct = 0) {
    const sc = SCALES[song.scale].steps, L = sc.length, low = KINDS[kind].low, root = low - ((low - song.key) % 12 + 12) % 12;
    const k = ((d % L) + L) % L, o = Math.floor(d / L);
    return root + sc[k] + 12 * (o + oct) + (root < low - 2 ? 12 : 0);
  },
  chord(song, kind, deg) {   // a triad on a degree, voiced inside the track's range
    const c = chordSet(song)[deg % 7], lo = KINDS[kind].low;
    return c.tones.map(m => { let v = m; while (v < lo + 2) v += 12; while (v > lo + 19) v -= 12; return v; }).sort((a, b) => a - b);
  },
  prog: [0, 5, 3, 4],   // i–VI–iv–v in minor keys, I–vi–IV–V in major ones
  /* each loop writes one bar at a time; bar b plays the progression's chord b */
  lib: {
    drums: [
      ['Boom bap', (b) => [[0, 0], [7, 0, 0.7], [10, 0], [4, 1], [12, 1], ...[0, 2, 4, 6, 8, 10, 12, 14].map(s => [s, 3, s % 4 ? 0.45 : 0.7]), [14, 4, 0.5]]],
      ['Four on the floor', (b) => [[0, 0], [4, 0], [8, 0], [12, 0], [4, 2], [12, 2], [2, 4, 0.6], [6, 4, 0.6], [10, 4, 0.6], [14, 4, 0.6], ...[0, 4, 8, 12].map(s => [s, 3, 0.4])]],
      ['Trap rolls', (b) => [[0, 0], [7, 0, 0.8], [11, 0, 0.9], [8, 2], ...[...Array(16).keys()].map(s => [s, 3, s % 2 ? 0.35 : 0.6]), ...(b % 2 ? [[13, 3, 0.4], [15, 3, 0.4]] : [])]],
      ['Rock steady', (b) => [[0, 0], [8, 0], [10, 0, 0.8], [4, 1], [12, 1], ...[0, 2, 4, 6, 8, 10, 12, 14].map(s => [s, 3, 0.55]), ...(b === 0 ? [[0, 7, 0.7]] : [])]],
      ['Breakbeat', (b) => [[0, 0], [10, 0], [11, 0, 0.7], [4, 1], [7, 1, 0.4], [12, 1], [15, 1, 0.4], ...[0, 2, 4, 6, 8, 10, 12, 14].map(s => [s, 3, 0.5]), [6, 4, 0.5]]],
      ['Tom fill (last bar)', (b, bars) => b === bars - 1 ? [[0, 0], [4, 1], [8, 6], [9, 6, 0.8], [10, 5], [11, 5, 0.8], [12, 5], [13, 1, 0.7], [14, 1, 0.8], [15, 1]] : [[0, 0], [8, 0], [4, 1], [12, 1], ...[0, 2, 4, 6, 8, 10, 12, 14].map(s => [s, 3, 0.5])]],
    ],
    bass: [
      ['Root pulse', (b, _, d) => [0, 2, 4, 6, 8, 10, 12, 14].map(s => [s, d(0), 1, s % 4 ? 0.65 : 0.9])],
      ['Octave funk', (b, _, d) => [[0, d(0), 2], [3, d(7), 1, 0.7], [4, d(0), 1, 0.8], [7, d(0), 1, 0.6], [10, d(7), 1, 0.7], [12, d(4), 2, 0.8], [14, d(6), 2, 0.7]]],
      ['Long sub', (b, _, d) => [[0, d(0), 14, 0.9]]],
      ['Walking', (b, _, d) => [[0, d(0), 3], [4, d(2), 3, 0.8], [8, d(4), 3, 0.85], [12, d(5), 3, 0.8]]],
      ['Syncopated', (b, _, d) => [[0, d(0), 3], [3, d(0), 2, 0.7], [6, d(0), 2, 0.8], [10, d(4), 2, 0.75], [14, d(2), 2, 0.7]]],
    ],
    keys: [
      ['Whole chords', (b, _, d, ch) => ch().map(m => [0, m, 15, 0.6])],
      ['Off-beat stabs', (b, _, d, ch) => [2, 6, 10, 14].flatMap(s => ch().map(m => [s, m, 1, 0.55]))],
      ['Two-step comp', (b, _, d, ch) => [[0, 3, 0.6], [6, 2, 0.5], [10, 4, 0.55]].flatMap(([s, l, v]) => ch().map(m => [s, m, l, v]))],
      ['Broken chord', (b, _, d, ch) => { const c = ch(); return [0, 2, 4, 6, 8, 10, 12, 14].map((s, k) => [s, c[[0, 1, 2, 1][k % 4]] + (k >= 4 ? 12 : 0), 2, 0.55]); }],
    ],
    synth: [
      ['Arp up 16ths', (b, _, d, ch) => { const c = ch(); return [...Array(16).keys()].map(s => [s, c[s % 3] + 12 * Math.floor((s % 6) / 3), 1, s % 4 ? 0.5 : 0.7]); }],
      ['Slow pad', (b, _, d, ch) => ch().map(m => [0, m, 16, 0.45])],
      ['Hook', (b, _, d) => b % 2 ? [[0, d(4), 2], [2, d(3), 2, 0.7], [4, d(2), 4], [12, d(0), 4, 0.6]] : [[0, d(0), 2], [2, d(2), 2, 0.7], [4, d(4), 3], [8, d(5), 2, 0.8], [10, d(4), 4, 0.7]]],
      ['Chip blips', (b, _, d) => [[0, d(7), 1], [3, d(9), 1, 0.7], [6, d(7), 1, 0.7], [8, d(11), 1], [11, d(9), 1, 0.6], [14, d(7), 2, 0.6]]],
    ],
  },
  build(i, k) {
    const s = App.song, t = s.tracks[i], [, fn] = this.lib[t.kind][k], out = [];
    for (let b = 0; b < s.bars; b++) {
      const dg = this.prog[b % 4], d = (x) => this.deg(s, t.kind, x + (t.kind === 'drums' ? 0 : dg)), ch = () => this.chord(s, t.kind, dg);
      for (const [st, n, l = 1, v = 0.9] of fn(b, s.bars, d, ch)) {
        if (t.kind === 'drums') out.push(N(b * 16 + st, n, 1, l === 1 ? v : l));   // drum rows are [step, lane, velocity]
        else out.push(N(b * 16 + st, n, l, v));
      }
    }
    return out;
  },
  preview: null,
  sheet() {
    const s = App.song, i = App.track, t = s.tracks[i], K = KINDS[t.kind];
    const list = h('div', { style: { display: 'grid', gap: '6px' } }, this.lib[t.kind].map(([name], k) => {
      const use = h('button.btn', { title: 'Put this loop into scene ' + 'ABCD'[App.scene] }, 'Use');
      use.onclick = () => { t.pats[App.scene] = this.build(i, k); App.changed(); UI.grid(); close(); toast(name + ' → ' + K.name + ', scene ' + 'ABCD'[App.scene]); if (!Seq.playing) Seq.start(); };
      return h('div.row', { style: { justifyContent: 'space-between', background: 'var(--panel2)', borderRadius: '6px', padding: '6px 8px' } }, h('span', name), use);
    }));
    const close = Sheets.open('Loops for ' + K.name, h('p', { style: { margin: 0, color: 'var(--mute)', fontSize: '12px' } }, `Every loop fits ${NOTE_NAMES[s.key]} ${SCALES[s.scale].name} and follows the chords bar by bar. It replaces this track in scene ${'ABCD'[App.scene]}.`), list);
  },
};
/* ---------- playing from the computer keyboard ---------- */
const Typing = {
  map: { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16 },
  init() {
    addEventListener('keydown', (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select')) return;
      if (e.code === 'KeyZ' || e.code === 'KeyX') { App.octave = clamp(App.octave + (e.code === 'KeyX' ? 1 : -1), -2, 2); Play.render(); toast('Octave ' + (App.octave >= 0 ? '+' : '') + App.octave); return; }
      if (e.code === 'KeyR' && !e.shiftKey) { $('#bRec').click(); return; }
      const off = this.map[e.code]; if (off === undefined) return;
      const t = App.song.tracks[App.track]; let n;
      if (t.kind === 'drums') { n = [0, 2, 4, 5, 7, 9, 11, 12].indexOf(off); if (n < 0) return; }   // A S D F G H J K play the eight pads
      else { const lo = KINDS[t.kind].low + App.octave * 12; n = lo - ((lo % 12) + 12) % 12 + off; }
      e.preventDefault(); Live.on('kb' + e.code, App.track, n, 0.85);
      const el = document.querySelector(`#surface [data-m="${n}"]`); if (el) el.classList.add('down');
    });
    addEventListener('keyup', (e) => { if (this.map[e.code] === undefined) return; Live.off('kb' + e.code); document.querySelectorAll('#surface .down').forEach(el => el.classList.remove('down')); });
  },
};
/* ---------- sharing and exporting ---------- */
const Share = {
  async link() {
    const url = location.href.split('#')[0] + '#s=' + packSong(App.song);
    try { await navigator.clipboard.writeText(url); toast('Link copied. Anyone who opens it hears this song.'); }
    catch (e) { Sheets.open('Link to this song', h('textarea.sel', { rows: 4, style: { width: '100%' }, readonly: true }, url), h('p', { style: { margin: 0, fontSize: '12px', color: 'var(--mute)' } }, 'Copy this and send it. Opening it loads the song.')); }
  },
  /* the song's order: Song mode plays the scenes that have something in them; Loop mode plays this scene twice */
  order(song) { if (!song.chain) return [App.scene, App.scene]; const o = []; for (let s = 0; s < SCENES; s++) if (sceneHas(song, s)) o.push(s); return o.length ? o : [App.scene]; },
  async wav() {
    const C = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!C) { toast('This browser cannot render audio offline.'); return; }
    const song = App.song, order = this.order(song), sd = 60 / song.bpm / 4, steps = song.bars * 16, len = order.length * steps * sd + 3, rate = 44100;
    toast('Rendering ' + Math.round(len) + ' seconds of audio...');
    await new Promise(r => setTimeout(r, 30));
    const ctx = new C(2, Math.ceil(len * rate), rate), E = new Engine(ctx, true); E.mix(song);
    order.forEach((sc, k) => { for (let st = 0; st < steps; st++) { const t = 0.05 + (k * steps + st) * sd, tt = t + (st % 2 === 1 ? song.swing * sd * 0.66 : 0); song.tracks.forEach((tr, i) => { for (const n of tr.pats[sc]) if (n.s === st) E.play(song, i, n, tt, n.l * sd * 0.96); }); } });
    const buf = await ctx.startRendering(), blob = this.encode(buf), a = h('a', { href: URL.createObjectURL(blob), download: (song.title || 'jam').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.wav' });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast('Saved ' + a.download + ' (' + (blob.size / 1048576).toFixed(1) + ' MB)');
  },
  encode(buf) {   // 16-bit stereo PCM
    const n = buf.length, L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L, out = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
    out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++, o += 4) { out.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
    return new Blob([out], { type: 'audio/wav' });
  },
};
/* ---- 99-main.js ---- */
/* ============================================================
   Start-up: a song from a shared link, else the one you were
   making, else the demo. Then the playhead, the LCD and the
   level meters follow the music on every frame.
   ============================================================ */
function start() {
  const linked = location.hash.startsWith('#s=') ? unpackSong(location.hash.slice(3)) : null;
  App.song = linked || Store.load() || demoSong();
  if (linked) history.replaceState(null, '', location.pathname + location.search);
  UI.init(); Typing.init(); UI.all();
  let lastScene = -1;
  const frame = () => {
    requestAnimationFrame(frame);
    if (!Seq.playing || !Audio.ctx) return;
    const c = Seq.now(); if (!c) return;
    UI.head(c.scene === App.scene ? c.step : -1); UI.lcd(); UI.meters();
    if (c.scene !== lastScene) { lastScene = c.scene; UI.scenes(); }
  };
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden && Seq.playing) Seq.stop(); });
  const touch = matchMedia('(pointer: coarse)').matches;
  toast(linked ? 'Song loaded from the link. Press ▶' : touch ? 'Press ▶ to play. Tap the grid to add notes.' : 'Press ▶ (or Space) to play. A–K play notes.');
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
