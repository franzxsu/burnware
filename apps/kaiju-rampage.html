<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kaiju Rampage: Tuko, 40 metres tall, loose in a city made of blocks.">
<meta name="theme-color" content="#5c1408">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Kaiju Rampage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Kaiju Rampage: a sunset city under attack, seen through a TV-news HUD. One deliberate dark look.
   Layout: a full-screen 3D view; HUD pinned to the corners inside the safe-area gutters. */
:root {
  color-scheme: dark;
  --ink: #0d0b14; --night: #171427; --paper: #fff8ec; --mute: #c9c0d6; --hp: #6de07a; --hp2: #ffcf4a; --hp3: #ff5a4a;
  --beam: #66e8ff; --news: #d8262f; --news2: #1d1a2e; --gold: #ffc94a; --tuko: #4cbf5a;
  --disp: "Bungee", "Impact", "Arial Black", system-ui, sans-serif; --ui: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(12px, env(safe-area-inset-top, 0px)); --gb: max(12px, env(safe-area-inset-bottom, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font: 600 16px/1.3 var(--ui); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font: inherit; color: inherit; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: fixed; pointer-events: none; z-index: 5; text-shadow: 0 2px 0 rgba(0,0,0,.55); }
#tl { left: var(--gl); top: var(--gt); display: grid; gap: 6px; width: min(300px, 44vw); }
.bar { height: 14px; border-radius: 3px; background: rgba(10,8,20,.6); box-shadow: inset 0 0 0 2px rgba(255,255,255,.16); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 2px auto 2px 2px; border-radius: 2px; transition: width .15s; }
#hpbar i { background: linear-gradient(90deg, var(--hp3), var(--hp2) 45%, var(--hp)); width: calc(100% - 4px); }
#enbar i { background: linear-gradient(90deg, #2a8cff, var(--beam)); width: calc(100% - 4px); }
.lbl { font: 700 13px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; opacity: .92; }
#tc { left: 50%; top: var(--gt); transform: translateX(-50%); text-align: center; }
#timer { font: 28px/1 var(--disp); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
#timer.low { color: var(--hp3); animation: pulse .5s ease-in-out infinite alternate; }
#wave { font: 700 13px/1.2 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }
#tr { right: var(--gr); top: var(--gt); text-align: right; }
#dmg { font: clamp(22px, 4.2vw, 36px)/1 var(--disp); color: var(--gold); font-variant-numeric: tabular-nums; }
#dmglbl { font: 700 12px/1.3 var(--ui); letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
#combo { font: 22px/1 var(--disp); color: var(--paper); margin-top: 4px; transform-origin: right; }
#combo.pop { animation: pop .25s ease-out; }
#news { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; height: 34px; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--news2); box-shadow: 0 -2px 0 var(--news); pointer-events: none; }
#news b { flex: none; display: flex; align-items: center; padding: 0 12px 0 var(--gl); background: var(--news); font: 15px/1 var(--disp); letter-spacing: .04em; }
#news .roll { flex: 1; overflow: hidden; position: relative; }
#news .roll span { position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%); font: 700 19px/1 var(--ui); letter-spacing: .02em; text-transform: uppercase; will-change: transform; }
#toast { position: fixed; left: 50%; top: 26%; transform: translate(-50%, -50%); z-index: 7; font: clamp(26px, 6vw, 56px)/1 var(--disp); text-align: center; color: var(--paper); text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 24px rgba(255,120,40,.5); pointer-events: none; opacity: 0; white-space: nowrap; }
#toast small { display: block; font: 700 clamp(14px, 2.6vw, 20px)/1.2 var(--ui); letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; color: var(--gold); }
#toast.show { animation: toast 1.8s ease-out forwards; }
#cross { position: fixed; left: 50%; top: 42%; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s; }
#cross.on { opacity: .9; }
/* touch controls */
#pad { position: fixed; inset: 0 0 34px 0; z-index: 3; display: none; }
.touch #pad { display: block; }
#stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); display: none; pointer-events: none; z-index: 4; }
#stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.35); }
#acts { position: fixed; right: var(--gr); bottom: calc(46px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: none; grid-template-columns: repeat(2, 72px); gap: 10px; }
.touch #acts { display: grid; }
#acts button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: rgba(20,16,36,.62); box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); font: 13px/1 var(--disp); letter-spacing: .02em; touch-action: none; }
#acts button.on, #acts button:active { background: rgba(255,201,74,.45); }
#acts button[data-a=beam] { box-shadow: inset 0 0 0 2px var(--beam); }
#topbtns { position: fixed; z-index: 8; left: var(--gl); top: calc(var(--gt) + 74px); display: flex; gap: 8px; }
#topbtns button, .sbtn { border: 0; border-radius: 8px; padding: 7px 12px; background: rgba(20,16,36,.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); font: 700 14px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
#topbtns button:focus-visible, .sbtn:focus-visible, .big:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* title and results */
.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: var(--gt) var(--gr) var(--gb) var(--gl); background: radial-gradient(ellipse at 50% 60%, rgba(13,11,20,.2), rgba(13,11,20,.78)); overflow: auto; }
.card { max-width: 640px; width: 100%; text-align: center; display: grid; gap: 14px; justify-items: center; }
.title { font: clamp(44px, 11vw, 108px)/.86 var(--disp); color: var(--paper); text-shadow: 0 6px 0 #6a1f2a, 0 0 40px rgba(255,110,40,.55); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.title em { font-style: normal; color: var(--gold); }
.sub { font: 700 clamp(15px, 2.4vw, 20px)/1.3 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin: 0; }
.big { border: 0; border-radius: 12px; padding: 14px 28px; background: var(--news); color: #fff; font: clamp(18px, 3vw, 24px)/1 var(--disp); letter-spacing: .03em; cursor: pointer; box-shadow: 0 5px 0 #7a1219, 0 10px 30px rgba(216,38,47,.4); }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a1219; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 18px; font: 600 15px/1.3 var(--ui); color: var(--mute); width: 100%; max-width: 560px; text-align: left; }
.keys b { color: var(--paper); font-weight: 800; letter-spacing: .04em; }
.best { font: 700 15px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.report { width: 100%; max-width: 460px; display: grid; gap: 4px; font: 600 18px/1.3 var(--ui); }
.report div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.14); padding: 4px 2px; }
.report div span:last-child { font-variant-numeric: tabular-nums; color: var(--paper); }
.report div span:first-child { color: var(--mute); }
.rank { font: clamp(26px, 6vw, 46px)/1 var(--disp); color: var(--gold); text-shadow: 0 4px 0 #6a1f2a; }
.note { font: 600 13px/1.4 var(--ui); color: var(--mute); max-width: 52ch; }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--ink); font: 22px/1.2 var(--disp); color: var(--gold); text-align: center; padding: 0 var(--gr) 0 var(--gl); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes pulse { to { opacity: .55; } }
@media (max-width: 560px) { #tl { width: 40vw; } .lbl { font-size: 11px; } #timer { font-size: 22px; } #news .roll span { font-size: 16px; } #news b { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { #toast.show { animation-duration: 2.4s; } #timer.low { animation: none; } #combo.pop { animation: none; } }
.fl { position: fixed; z-index: 6; pointer-events: none; font: 18px/1 var(--disp); color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.6); white-space: nowrap; }
.fl.xl { font-size: 28px; color: var(--paper); }
#hurt { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .25s; box-shadow: inset 0 0 140px 40px rgba(255,40,40,.65); }
#pausebox .sbtn { margin-top: 4px; }
</style>
</head>
<body>

<div id="view" aria-label="Kaiju Rampage, a 3D city"></div>
<div id="loading">LOADING THE CITY…</div>
<div class="hud" id="tl" hidden>
  <div class="lbl"><span>Tuko</span><span id="hpnum">100</span></div><div class="bar" id="hpbar"><i></i></div>
  <div class="lbl"><span>Beam</span><span id="ennum">100</span></div><div class="bar" id="enbar"><i></i></div>
</div>
<div class="hud" id="tc" hidden><div id="timer">3:00</div><div id="wave"></div></div>
<div class="hud" id="tr" hidden><div id="dmglbl">Damage so far</div><div id="dmg">$0</div><div id="combo"></div></div>
<div id="topbtns" hidden><button id="bMute" aria-label="Sound">Sound on</button><button id="bPause" aria-label="Pause">Pause</button></div>
<svg id="cross" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="#66e8ff" stroke-width="2"/><path d="M13 0v7M13 19v7M0 13h7M19 13h7" stroke="#66e8ff" stroke-width="2"/></svg>
<div id="toast" aria-live="polite"></div>
<div id="pad"></div><div id="stick"><i></i></div>
<div id="acts" aria-label="Actions"><button data-a="stomp">STOMP</button><button data-a="tail">TAIL</button><button data-a="roar">ROAR</button><button data-a="beam">BEAM</button></div>
<div id="news" hidden><b>BREAKING</b><div class="roll"><span id="ticker"></span></div></div>
<section class="screen" id="title" hidden>
  <div class="card">
    <p class="sub">Tonight on the evening news</p>
    <h1 class="title">KAIJU<br><em>RAMPAGE</em></h1>
    <p class="sub">Starring Tuko, now 40 metres tall</p>
    <button class="big" id="go">START THE RAMPAGE</button>
    <div class="keys" id="keys"></div>
    <div class="best" id="best"></div>
    <p class="note">Three minutes. Flatten what you can. The army will have opinions. Nobody gets hurt: people run for the subway and pop out of sight.</p>
  </div>
</section>
<section class="screen" id="results" hidden>
  <div class="card">
    <p class="sub" id="resWhy">Rampage report</p>
    <div class="rank" id="rank"></div>
    <div class="report" id="report"></div>
    <div class="best" id="resBest"></div>
    <button class="big" id="again">RAMPAGE AGAIN</button>
  </div>
</section>
<script>
/* ---- 10-core.js ---- */
/* ============================================================
   Kaiju Rampage — helpers, saved best scores, and input:
   keyboard, mouse-drag camera, and a touch stick with buttons.
   ============================================================ */
if (typeof THREE === 'undefined') { document.getElementById('loading').textContent = 'The 3D engine did not load. Check your connection and reload the page.'; throw new Error('three.js did not load'); }
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const isTouch = () => (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
const Save = {
  key: 'kaiju-rampage-v1', data: { best: 0, bestRank: '', sound: true, runs: 0 },
  load() { try { const s = localStorage.getItem(this.key); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { /* no storage: fine */ } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
};
function money(v) {
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(v >= 1e10 ? 1 : 2) + 'B';
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(v >= 1e8 ? 0 : 1) + 'M';
  if (v >= 1e3) return '$' + Math.round(v / 1e3) + 'K';
  return '$' + Math.round(v);
}
const Input = {
  keys: {}, stick: [0, 0], yaw: Math.PI * 0.75, pitch: 0.42, dist: 46, edge: {}, beam: false, touch: false,
  press(a) { this.edge[a] = true; },
  take(a) { const v = !!this.edge[a]; this.edge[a] = false; return v; },
  move() {   // the wanted direction in camera space: x = right, y = forward
    let x = this.stick[0], y = this.stick[1];
    const k = this.keys;
    if (k.KeyW || k.ArrowUp) y += 1; if (k.KeyS || k.ArrowDown) y -= 1; if (k.KeyA || k.ArrowLeft) x -= 1; if (k.KeyD || k.ArrowRight) x += 1;
    const m = Math.hypot(x, y); return m > 1 ? [x / m, y / m] : [x, y];
  },
  init(el) {
    addEventListener('keydown', (e) => {
      if (e.repeat && e.code !== 'KeyF') return;
      this.keys[e.code] = true;
      if (Game.state !== 'play') return;
      if (e.code === 'Space') { e.preventDefault(); this.press('stomp'); }
      if (e.code === 'KeyE' || e.code === 'KeyQ') this.press('tail');
      if (e.code === 'KeyR') this.press('roar');
      if (e.code === 'KeyF') this.beam = true;
      if (/^Arrow/.test(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => { this.keys[e.code] = false; if (e.code === 'KeyF') this.beam = false; });
    addEventListener('blur', () => { this.keys = {}; this.beam = false; this.stick = [0, 0]; });
    // mouse: drag to look around, wheel to zoom, right button fires the beam
    let drag = null;
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;
      if (e.button === 2) { this.beam = true; return; }
      drag = [e.clientX, e.clientY]; try { el.setPointerCapture(e.pointerId); } catch (x) { /* fine */ }
    });
    el.addEventListener('pointermove', (e) => { if (!drag || e.pointerType === 'touch') return; this.look(e.clientX - drag[0], e.clientY - drag[1]); drag = [e.clientX, e.clientY]; });
    el.addEventListener('pointerup', (e) => { if (e.button === 2) this.beam = false; drag = null; });
    el.addEventListener('wheel', (e) => { e.preventDefault(); this.dist = clamp(this.dist * (e.deltaY > 0 ? 1.08 : 0.93), 26, 90); }, { passive: false });

    const pad = $('#pad'), stick = $('#stick'), knob = stick.firstElementChild;
    const touches = new Map();
    pad.addEventListener('pointerdown', (e) => {
      this.touch = true; document.body.classList.add('touch');
      const kind = e.clientX < innerWidth * 0.45 && ![...touches.values()].some(t => t.kind === 'stick') ? 'stick' : 'look';
      touches.set(e.pointerId, { kind, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY });
      if (kind === 'stick') { stick.style.display = 'block'; stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px'; knob.style.transform = ''; }
      try { pad.setPointerCapture(e.pointerId); } catch (x) { /* that finger already lifted */ }
    });
    pad.addEventListener('pointermove', (e) => {
      const t = touches.get(e.pointerId); if (!t) return;
      if (t.kind === 'stick') { const dx = e.clientX - t.x0, dy = e.clientY - t.y0, m = Math.hypot(dx, dy), r = 50, k = m > r ? r / m : 1; knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`; this.stick = [dx * k / r, -dy * k / r]; }
      else { this.look((e.clientX - t.x) * 1.4, (e.clientY - t.y) * 1.2); t.x = e.clientX; t.y = e.clientY; }
    });
    const up = (e) => { const t = touches.get(e.pointerId); if (!t) return; if (t.kind === 'stick') { this.stick = [0, 0]; stick.style.display = 'none'; } touches.delete(e.pointerId); };
    pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
    for (const b of document.querySelectorAll('#acts button')) {
      const a = b.dataset.a;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.classList.add('on'); Audio2.init(); if (a === 'beam') this.beam = true; else this.press(a); });

    }

  },
  look(dx, dy) { this.yaw -= dx * 0.0055; this.pitch = clamp(this.pitch + dy * 0.004, -0.32, 1.2); },
};
/* ---- 15-audio.js ---- */
/* ============================================================
   Sound, synthesized: footsteps, crumbling, explosions, a roar,
   the beam, rotors, sirens, and a taiko-drum war march.
   ============================================================ */
const Audio2 = (() => {
  let ctx = null, master = null, sfx = null, mus = null, on = true, noiseBuf = null, beamNode = null, heli = null, siren = null, march = null;
  const T = () => ctx.currentTime;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; master.connect(comp); comp.connect(ctx.destination);
    sfx = ctx.createGain(); sfx.connect(master); mus = ctx.createGain(); mus.gain.value = 0.32; mus.connect(master);
    const n = ctx.sampleRate * 2; noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  function noise(t, dur, { vol = 0.3, f = 800, q = 0.7, type = 'lowpass', to = sfx, attack = 0.005, slide = 0 } = {}) {
    if (!ctx) return; const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (slide) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur); fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(to); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function tone(f, t, dur, { type = 'sine', vol = 0.2, slide = 0, attack = 0.005, to = sfx } = {}) {
    if (!ctx) return; const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(to); o.start(t); o.stop(t + dur + 0.05);
  }
  let lastCrumble = 0, lastBoom = 0;
  return {
    init, get on() { return on; },
    setOn(v) { on = v; if (master) master.gain.setTargetAtTime(v ? 0.8 : 0, T(), 0.05); },
    step(big) { if (!ctx) return; const t = T(); tone(big ? 70 : 58, t, big ? 0.6 : 0.35, { vol: big ? 0.9 : 0.55, slide: 0.45 }); noise(t, big ? 0.5 : 0.25, { vol: big ? 0.5 : 0.22, f: 260 }); },

  say(text) { this.queue.unshift(text); if (this.el && this.x > 0) this.next(); },
  event(key) { const L = LINES[key]; if (!L) return; const now = performance.now(); if (now - (this.last[key] || -1e9) < 20000) return; this.last[key] = now; this.queue.push(pick(L)); },
  next() { this.el.textContent = this.queue.length ? this.queue.shift() : pick(FILLER); this.w = this.el.offsetWidth; this.x = this.el.parentElement.clientWidth + 10; },
  update(dt) {
    if (!this.el) { this.el = $('#ticker'); if (!this.el) return; this.next(); }
    this.x -= dt * (calm() ? 60 : 95); if (this.x < -this.w - 20) this.next();
    this.el.style.transform = `translate(${this.x.toFixed(1)}px, -50%)`;
  },
};
const News = { event: (k) => Ticker.event(k) };
const HUD = {
  floats: [], v: new THREE.Vector3(), shownMult: 1,
  init() {
    $('#keys').innerHTML = Input.touch
      ? '<div><b>Left thumb</b> walk</div><div><b>Drag right side</b> look</div><div><b>STOMP</b> shockwave</div><div><b>TAIL</b> spin attack</div><div><b>ROAR</b> scare the choppers</div><div><b>Hold BEAM</b> drill where you aim</div>'
      : '<div><b>WASD</b> walk</div><div><b>Drag</b> look · <b>wheel</b> zoom</div><div><b>Space</b> stomp</div><div><b>E</b> tail spin</div><div><b>R</b> roar</div><div><b>Hold F</b> or right mouse: beam</div><div><b>P</b> pause</div>';
    this.best();
    $('#go').onclick = () => Game.start(); $('#again').onclick = () => { HUD.screen(null); Game.start(); };
    $('#bMute').onclick = () => { const on = !Audio2.on; Audio2.setOn(on); Save.data.sound = on; Save.save(); $('#bMute').textContent = on ? 'Sound on' : 'Sound off'; };
    $('#bPause').onclick = () => this.pause(!Game.paused);
    $('#bMute').textContent = Save.data.sound ? 'Sound on' : 'Sound off'; Audio2.setOn(Save.data.sound);
    addEventListener('keydown', (e) => { if ((e.code === 'KeyP' || e.code === 'Escape') && (Game.state === 'play' || Game.paused)) this.pause(!Game.paused); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play') this.pause(true); });
    this.hurtEl = document.createElement('div'); this.hurtEl.id = 'hurt'; document.body.append(this.hurtEl);
  },
  best() { $('#best').textContent = Save.data.best ? `Best rampage: ${money(Save.data.best)} · ${Save.data.bestRank}` : ''; },
  show(on) { for (const id of ['#tl', '#tc', '#tr', '#news', '#topbtns']) $(id).hidden = !on; $('#cross').classList.toggle('on', on); },
  screen(name) { for (const id of ['title', 'results']) $('#' + id).hidden = id !== name; if (name === 'title') this.best(); },
  toast(big, small) { const t = $('#toast'); t.innerHTML = ''; t.append(big); if (small) { const s = document.createElement('small'); s.textContent = small; t.append(s); } t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); },
  combo(m) { const c = $('#combo'); c.textContent = 'x' + m + ' COMBO'; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); },
  wave(w) { $('#wave').textContent = w; },
  hurt(n) { this.hurtEl.style.opacity = Math.min(0.85, 0.25 + n * 0.12); clearTimeout(this.hurtT); this.hurtT = setTimeout(() => { this.hurtEl.style.opacity = 0; }, 160); },
  float(text, x, y, z, big) {
    this.v.set(x, y, z).project(World.camera); if (this.v.z > 1) return;
    const el = document.createElement('div'); el.className = 'fl' + (big ? ' xl' : ''); el.textContent = text;
    el.style.left = ((this.v.x + 1) / 2 * innerWidth).toFixed(0) + 'px'; el.style.top = ((1 - this.v.y) / 2 * innerHeight).toFixed(0) + 'px';
    document.body.append(el); el.animate([{ transform: 'translate(-50%,-50%) scale(.7)', opacity: 0 }, { transform: 'translate(-50%,-90%) scale(1)', opacity: 1, offset: 0.15 }, { transform: 'translate(-50%,-260%) scale(1)', opacity: 0 }], { duration: big ? 1800 : 1200, easing: 'ease-out' }).onfinish = () => el.remove();
  },
  update(dt) {
    if (Game.state === 'play' || Game.state === 'intro' || Game.state === 'results') {
      const K = Kaiju, hp = Math.ceil(K.hp), en = Math.floor(K.energy);
      $('#hpbar i').style.width = `calc(${K.hp}% - 4px)`; $('#hpnum').textContent = hp;
      $('#enbar i').style.width = `calc(${K.energy}% - 4px)`; $('#ennum').textContent = en;
      const s = Math.ceil(Game.left), tm = $('#timer'); tm.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); tm.classList.toggle('low', s <= 20 && Game.state === 'play');
      $('#dmg').textContent = money(Game.score);
      if (Game.mult === 1 && this.shownMult !== 1) $('#combo').textContent = ''; this.shownMult = Game.mult;
    }
    if (Game.state !== 'title') Ticker.update(dt);
  },
  pause(on) {
    if (Game.state !== 'play' && !Game.paused) return;
    Game.paused = on; Audio2.music(!on && Game.state === 'play'); if (on) { Audio2.beam(false); Audio2.heli(0); Audio2.siren(0); }
    let p = $('#pausebox');
    if (on && !p) {
      p = document.createElement('section'); p.id = 'pausebox'; p.className = 'screen';
      p.innerHTML = '<div class="card"><h1 class="title" style="font-size:clamp(40px,9vw,80px)">PAUSED</h1><button class="big" id="resume">KEEP STOMPING</button><button class="sbtn" id="quit">Quit to the title</button></div>';
      document.body.append(p); $('#resume').onclick = () => this.pause(false); $('#quit').onclick = () => { this.pause(false); Game.over('quit'); };
    }
    if (!on && p) p.remove();
    $('#bPause').textContent = on ? 'Resume' : 'Pause';
  },
  results(why, best) {
    const S = Game.stats, rank = rankOf(Game.score);
    $('#resWhy').textContent = { time: "Time's up. The army is out of ideas.", down: 'Tuko got tired and waded back out to sea.', quit: 'Tuko went home early.' }[why] || 'Rampage report';
    $('#rank').textContent = rank;
    const rows = [['Damage', money(Game.score)], ['Buildings flattened', S.buildings], ['Blocks smashed', S.voxels.toLocaleString()], ['Cars crushed', S.car + S.police], ['Tanks flipped', S.tank], ['Helicopters downed', S.heli], ['Jets downed', S.jet], ['Biggest combo', 'x' + S.bestMult], ['Landmarks', S.landmarks.length ? [...new Set(S.landmarks)].join(', ') : 'none (yet)'], ['People who made it to the subway', 'all of them']];
    $('#report').innerHTML = ''; for (const [a, b] of rows) { const d = document.createElement('div'); d.innerHTML = '<span></span><span></span>'; d.children[0].textContent = a; d.children[1].textContent = b; $('#report').append(d); }
    $('#resBest').textContent = best ? 'New best rampage!' : `Best: ${money(Save.data.best)} · ${Save.data.bestRank}`;
    this.show(false); this.screen('results');
  },
};
/* ---- 99-main.js ---- */
/* ============================================================
   Start-up: the scene, the city and everyone in it, then the
   show runs one frame at a time.
   ============================================================ */
async function boot() {
  const L = $('#loading');
  Save.load();
  try {
    World.init($('#view'));
    Mesher.init(); Vox.init(World.scene); Debris.init(World.scene); Fx.init(World.scene);
    Kaiju.init(World.scene); Units.init(World.scene);
    Input.init(World.renderer.domElement); HUD.init();
    L.textContent = 'BUILDING THE CITY…';
    await new Promise(r => setTimeout(r, 40));
    Game.build();
    L.hidden = true; Game.toTitle();
    requestAnimationFrame(frame);
  } catch (e) { console.error(e); L.textContent = 'Something went wrong while building the city (' + e.message + '). Try reloading the page.'; }
}
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
  if (Game.paused) dt = 0;
  if (dt > 0) { Game.update(dt); Debris.update(dt); Fx.update(dt); World.update(dt); }
  Vox.flush(Game.state === 'play' ? 6 : 14);
  HUD.update(dt);
  World.renderer.render(World.scene, World.camera);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
