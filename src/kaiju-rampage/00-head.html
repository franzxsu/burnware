<title>Kaiju Rampage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Kaiju Rampage: a sunset city under attack, seen through a TV-news HUD. One deliberate dark look.
   Layout: a full-screen 3D view; HUD pinned to the corners inside the safe-area gutters. */
:root {
  color-scheme: dark;
  --ink: #0d0b14; --night: #171427; --paper: #fff8ec; --mute: #c9c0d6; --hp: #6de07a; --hp2: #ffcf4a; --hp3: #ff5a4a;
  --beam: #66e8ff; --news: #d8262f; --news2: #1d1a2e; --gold: #ffc94a; --tuko: #4cbf5a;
  --disp: "Bungee", "Impact", "Arial Black", system-ui, sans-serif; --ui: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(12px, env(safe-area-inset-top, 0px)); --gb: max(12px, env(safe-area-inset-bottom, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font: 600 16px/1.3 var(--ui); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font: inherit; color: inherit; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: fixed; pointer-events: none; z-index: 5; text-shadow: 0 2px 0 rgba(0,0,0,.55); }
#tl { left: var(--gl); top: var(--gt); display: grid; gap: 6px; width: min(300px, 44vw); }
.bar { height: 14px; border-radius: 3px; background: rgba(10,8,20,.6); box-shadow: inset 0 0 0 2px rgba(255,255,255,.16); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 2px auto 2px 2px; border-radius: 2px; transition: width .15s; }
#hpbar i { background: linear-gradient(90deg, var(--hp3), var(--hp2) 45%, var(--hp)); width: calc(100% - 4px); }
#enbar i { background: linear-gradient(90deg, #2a8cff, var(--beam)); width: calc(100% - 4px); }
.lbl { font: 700 13px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; opacity: .92; }
#tc { left: 50%; top: var(--gt); transform: translateX(-50%); text-align: center; }
#timer { font: 28px/1 var(--disp); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
#timer.low { color: var(--hp3); animation: pulse .5s ease-in-out infinite alternate; }
#wave { font: 700 13px/1.2 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }
#tr { right: var(--gr); top: var(--gt); text-align: right; }
#dmg { font: clamp(22px, 4.2vw, 36px)/1 var(--disp); color: var(--gold); font-variant-numeric: tabular-nums; }
#dmglbl { font: 700 12px/1.3 var(--ui); letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
#combo { font: 22px/1 var(--disp); color: var(--paper); margin-top: 4px; transform-origin: right; }
#combo.pop { animation: pop .25s ease-out; }
#news { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; height: 34px; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--news2); box-shadow: 0 -2px 0 var(--news); pointer-events: none; }
#news b { flex: none; display: flex; align-items: center; padding: 0 12px 0 var(--gl); background: var(--news); font: 15px/1 var(--disp); letter-spacing: .04em; }
#news .roll { flex: 1; overflow: hidden; position: relative; }
#news .roll span { position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%); font: 700 19px/1 var(--ui); letter-spacing: .02em; text-transform: uppercase; will-change: transform; }
#toast { position: fixed; left: 50%; top: 26%; transform: translate(-50%, -50%); z-index: 7; font: clamp(26px, 6vw, 56px)/1 var(--disp); text-align: center; color: var(--paper); text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 24px rgba(255,120,40,.5); pointer-events: none; opacity: 0; white-space: nowrap; }
#toast small { display: block; font: 700 clamp(14px, 2.6vw, 20px)/1.2 var(--ui); letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; color: var(--gold); }
#toast.show { animation: toast 1.8s ease-out forwards; }
#cross { position: fixed; left: 50%; top: 42%; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s; }
#cross.on { opacity: .9; }
/* touch controls */
#pad { position: fixed; inset: 0 0 34px 0; z-index: 3; display: none; }
.touch #pad { display: block; }
#stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); display: none; pointer-events: none; z-index: 4; }
#stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.35); }
#acts { position: fixed; right: var(--gr); bottom: calc(46px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: none; grid-template-columns: repeat(2, 72px); gap: 10px; }
.touch #acts { display: grid; }
#acts button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: rgba(20,16,36,.62); box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); font: 13px/1 var(--disp); letter-spacing: .02em; touch-action: none; }
#acts button.on, #acts button:active { background: rgba(255,201,74,.45); }
#acts button[data-a=beam] { box-shadow: inset 0 0 0 2px var(--beam); }
#topbtns { position: fixed; z-index: 8; left: var(--gl); top: calc(var(--gt) + 74px); display: flex; gap: 8px; }
#topbtns button, .sbtn { border: 0; border-radius: 8px; padding: 7px 12px; background: rgba(20,16,36,.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); font: 700 14px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
#topbtns button:focus-visible, .sbtn:focus-visible, .big:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* title and results */
.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: var(--gt) var(--gr) var(--gb) var(--gl); background: radial-gradient(ellipse at 50% 60%, rgba(13,11,20,.2), rgba(13,11,20,.78)); overflow: auto; }
.card { max-width: 640px; width: 100%; text-align: center; display: grid; gap: 14px; justify-items: center; }
.title { font: clamp(44px, 11vw, 108px)/.86 var(--disp); color: var(--paper); text-shadow: 0 6px 0 #6a1f2a, 0 0 40px rgba(255,110,40,.55); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.title em { font-style: normal; color: var(--gold); }
.sub { font: 700 clamp(15px, 2.4vw, 20px)/1.3 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin: 0; }
.big { border: 0; border-radius: 12px; padding: 14px 28px; background: var(--news); color: #fff; font: clamp(18px, 3vw, 24px)/1 var(--disp); letter-spacing: .03em; cursor: pointer; box-shadow: 0 5px 0 #7a1219, 0 10px 30px rgba(216,38,47,.4); }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a1219; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 18px; font: 600 15px/1.3 var(--ui); color: var(--mute); width: 100%; max-width: 560px; text-align: left; }
.keys b { color: var(--paper); font-weight: 800; letter-spacing: .04em; }
.best { font: 700 15px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.report { width: 100%; max-width: 460px; display: grid; gap: 4px; font: 600 18px/1.3 var(--ui); }
.report div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.14); padding: 4px 2px; }
.report div span:last-child { font-variant-numeric: tabular-nums; color: var(--paper); }
.report div span:first-child { color: var(--mute); }
.rank { font: clamp(26px, 6vw, 46px)/1 var(--disp); color: var(--gold); text-shadow: 0 4px 0 #6a1f2a; }
.note { font: 600 13px/1.4 var(--ui); color: var(--mute); max-width: 52ch; }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--ink); font: 22px/1.2 var(--disp); color: var(--gold); text-align: center; padding: 0 var(--gr) 0 var(--gl); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes pulse { to { opacity: .55; } }
@media (max-width: 560px) { #tl { width: 40vw; } .lbl { font-size: 11px; } #timer { font-size: 22px; } #news .roll span { font-size: 16px; } #news b { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { #toast.show { animation-duration: 2.4s; } #timer.low { animation: none; } #combo.pop { animation: none; } }
.fl { position: fixed; z-index: 6; pointer-events: none; font: 18px/1 var(--disp); color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.6); white-space: nowrap; }
.fl.xl { font-size: 28px; color: var(--paper); }
#hurt { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .25s; box-shadow: inset 0 0 140px 40px rgba(255,40,40,.65); }
#pausebox .sbtn { margin-top: 4px; }
</style>
