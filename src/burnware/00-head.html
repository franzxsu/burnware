<title>Burnware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Burnware: a late-90s desktop. One deliberate look (grey bevelled chrome on a teal desk), so a single
   light palette; every colour is a token here. Layout: a full-screen desk above a 32px taskbar. */
:root {
  color-scheme: light;
  --face: #c3c3c3; --face2: #d4d0c8; --hi: #ffffff; --lo: #808080; --dk: #0a0a0a; --mid: #dfdfdf;
  --t1: #5c1408; --t2: #e2642c; --ti1: #808080; --ti2: #b9b9b9; --ttxt: #ffffff;
  --desk: #2a1620; --ink: #000000; --sel: #8a2410; --seltxt: #ffffff; --tip: #ffffe1; --field: #ffffff;
  --link: #0000ee; --visited: #551a8b; --felt: #18753a; --term: #0c0c0c; --termtxt: #b9f5c4; --bsod: #0000aa;
  --ui: Tahoma, Verdana, "Segoe UI", "DejaVu Sans", sans-serif;
  --mono: "VT323", "Lucida Console", "Courier New", monospace;
  --pix: "Silkscreen", "VT323", monospace;
  --comic: "Comic Neue", "Comic Sans MS", cursive;
  --serif: "Times New Roman", Times, Georgia, serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { background: var(--dk); color: var(--ink); font: 12px/1.35 var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button, input, textarea, select { font: inherit; color: inherit; }
textarea, input[type=text], input[type=password], [contenteditable] { user-select: text; -webkit-user-select: text; }
img, canvas { image-rendering: pixelated; }
.bev { background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }
.sunk { box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--mid); }
.field { background: var(--field); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--mid); border: 0; padding: 3px 5px; outline: none; }
.btn { background: var(--face); border: 0; min-width: 72px; min-height: 23px; padding: 3px 10px; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); cursor: pointer; }
.btn:active, .btn.on { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--mid); padding: 4px 9px 2px 11px; }
.btn:focus-visible, .tool:focus-visible, .icon:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
.btn[disabled] { color: var(--lo); text-shadow: 1px 1px var(--hi); cursor: default; }
.btn.def { box-shadow: inset 0 0 0 1px var(--dk), inset -2px -2px var(--dk), inset 2px 2px var(--hi), inset -3px -3px var(--lo), inset 3px 3px var(--mid); }
hr.groove { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi); margin: 4px 2px; }

/* ---------- the screen ---------- */
#screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }
#desk { position: relative; flex: 1; overflow: hidden; }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: auto; }
#icons { position: absolute; top: 10px; bottom: 6px; left: var(--gl); right: var(--gr); display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 78px); grid-auto-columns: 78px; gap: 2px 6px; align-content: start; pointer-events: none; }
.icon { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; width: 78px; border: 0; background: none; color: #fff; cursor: pointer; text-align: center; }
.icon img { width: 32px; height: 32px; }
.icon span { font-size: 11px; line-height: 1.2; padding: 1px 2px; text-shadow: 1px 1px 0 #000; max-width: 76px; overflow-wrap: break-word; }
.icon.sel span { background: var(--sel); color: var(--seltxt); text-shadow: none; outline: 1px dotted #fff; }
.icon.sel img { filter: brightness(.65) sepia(1) hue-rotate(170deg) saturate(3); }

/* ---------- windows ---------- */
.win { position: absolute; display: flex; flex-direction: column; padding: 3px; min-width: 200px; min-height: 120px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 3px 10px rgba(0,0,0,.25); }
.win.max { left: var(--gl) !important; right: var(--gr) !important; top: 0 !important; bottom: 0 !important; width: auto !important; height: auto !important; }
.win.min { display: none; }
.tb { display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 2px 0 3px; background: linear-gradient(90deg, var(--t1), var(--t2)); color: var(--ttxt); font-weight: 700; flex: none; cursor: default; touch-action: none; }
.win.inactive .tb { background: linear-gradient(90deg, var(--ti1), var(--ti2)); color: #d8d8d8; }
.tb img { width: 16px; height: 16px; flex: none; }
.tb .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbb { width: 18px; height: 16px; padding: 0; border: 0; flex: none; display: grid; place-items: center; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); cursor: pointer; color: var(--ink); }
.tbb:active { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo); }
.tbb svg { width: 10px; height: 10px; display: block; }
.tbb.x { margin-left: 2px; }
.menubar { display: flex; gap: 0; padding: 1px 0; flex: none; position: relative; }
.menubar > button { border: 0; background: none; padding: 2px 7px; cursor: pointer; }
.menubar > button:hover, .menubar > button.open { background: var(--sel); color: var(--seltxt); }
.dropdown { position: absolute; z-index: 5; min-width: 160px; padding: 2px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.25); }
.dropdown button { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0; background: none; padding: 3px 18px 3px 20px; text-align: left; cursor: pointer; white-space: nowrap; }
.dropdown button:hover:not([disabled]) { background: var(--sel); color: var(--seltxt); }
.dropdown button[disabled] { color: var(--lo); text-shadow: 1px 1px var(--hi); }
.dropdown small { opacity: .8; }
.wbody { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.grip { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 50%, var(--lo) 50%, var(--lo) 56%, var(--hi) 56%, var(--hi) 62%, transparent 62%, transparent 70%, var(--lo) 70%, var(--lo) 76%, var(--hi) 76%, var(--hi) 82%, transparent 82%); }
.win.max .grip { display: none; }
.status { display: flex; gap: 2px; flex: none; margin-top: 2px; }
.status > * { flex: 1; padding: 1px 4px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar { display: flex; gap: 2px; align-items: center; padding: 2px; flex: none; flex-wrap: wrap; }
.tool { border: 0; background: var(--face); min-width: 24px; height: 24px; padding: 2px 6px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.tool:hover { box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--hi); }
.tool:active, .tool.on { box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); background: var(--mid); }
.tool img { width: 16px; height: 16px; }

/* ---------- taskbar ---------- */
#taskbar { position: relative; flex: none; height: 32px; padding: 2px var(--gr) calc(2px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; gap: 4px; align-items: center; background: var(--face); box-shadow: inset 0 1px var(--face2), inset 0 2px var(--hi); z-index: 9000; box-sizing: content-box; }
#start { display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px 0 4px; font-weight: 700; border: 0; background: var(--face); cursor: pointer; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); flex: none; }
#start.on { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--mid); }
#start img { width: 18px; height: 18px; }
#tasks { flex: 1; min-width: 0; display: flex; gap: 3px; overflow: hidden; }
.task { flex: 0 1 160px; min-width: 32px; height: 24px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border: 0; background: var(--face); cursor: pointer; text-align: left; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }
.task span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task img { width: 16px; height: 16px; flex: none; }
.task.on { font-weight: 700; background: repeating-conic-gradient(var(--hi) 0 25%, var(--mid) 0 50%) 0 0 / 2px 2px; box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo); }
#tray { flex: none; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 6px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); }
#tray button { border: 0; background: none; padding: 0; cursor: pointer; display: grid; }
#tray img { width: 16px; height: 16px; }
#clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
#startmenu { position: absolute; left: var(--gl); bottom: 100%; margin-bottom: -2px; display: flex; padding: 3px; z-index: 9001; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.25); }
#startmenu .side { width: 24px; background: linear-gradient(0deg, var(--t1), var(--t2)); color: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
#startmenu .side b { writing-mode: vertical-rl; transform: rotate(180deg); font: 700 17px/1 var(--pix); letter-spacing: 1px; }
#startmenu .side b i { font-style: normal; color: #ffd46a; }
#startmenu .items { display: flex; flex-direction: column; min-width: 196px; }
.smi { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 18px 4px 6px; text-align: left; cursor: pointer; position: relative; }
.smi img { width: 32px; height: 32px; }
.smi.small img { width: 16px; height: 16px; }
.smi:hover, .smi.open { background: var(--sel); color: var(--seltxt); }
.smi .arrow { position: absolute; right: 6px; }
.submenu { position: absolute; left: 100%; top: 0; display: flex; flex-direction: column; padding: 2px; min-width: 190px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.25); z-index: 2; }
.submenu .smi { padding: 3px 18px 3px 6px; color: var(--ink); }
.submenu .smi:hover { color: var(--seltxt); }

/* ---------- dialogs and bits ---------- */
.dlg { display: flex; gap: 14px; padding: 14px 12px 8px; align-items: flex-start; }
.dlg img { width: 32px; height: 32px; flex: none; }
.dlg p { margin: 0 0 6px; max-width: 46ch; }
.dlgbtns { display: flex; gap: 8px; justify-content: center; padding: 8px 10px 10px; flex-wrap: wrap; }
#tuko.talking { z-index: 8000; }
.tip { position: absolute; background: var(--tip); border: 1px solid var(--ink); padding: 2px 5px; z-index: 9500; pointer-events: none; white-space: nowrap; }
.ctx { position: absolute; z-index: 9200; }
.scroller { overflow: auto; min-height: 0; flex: 1; }
.scroller::-webkit-scrollbar { width: 16px; height: 16px; background: repeating-conic-gradient(var(--hi) 0 25%, var(--face) 0 50%) 0 0 / 2px 2px; }
.scroller::-webkit-scrollbar-thumb { background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }

/* ---------- Explorer ---------- */
.addr { display: flex; gap: 4px; align-items: center; padding: 2px 4px; flex: none; }
.addr .field { flex: 1; min-width: 0; height: 21px; box-sizing: border-box; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 4px; padding: 8px; align-content: start; background: var(--field); }
.fitem { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 4px 2px; cursor: pointer; text-align: center; }
.fitem img { width: 32px; height: 32px; }
.fitem span { font-size: 11px; padding: 0 2px; overflow-wrap: anywhere; }
.fitem.sel span { background: var(--sel); color: var(--seltxt); }
.fitem.sel img { filter: brightness(.65) sepia(1) hue-rotate(170deg) saturate(3); }
.empty-note { padding: 18px; color: var(--lo); grid-column: 1 / -1; text-align: center; }

/* ---------- Notepad ---------- */
.note { flex: 1; min-height: 0; resize: none; font: 13px/1.4 "Lucida Console", "Courier New", monospace; padding: 4px 6px; white-space: pre-wrap; }
.note.nowrap { white-space: pre; overflow-x: auto; }

/* ---------- Paint ---------- */
.paint { display: flex; flex: 1; min-height: 0; gap: 2px; }
.ptools { display: grid; grid-template-columns: 26px 26px; gap: 1px; align-content: start; padding: 2px; flex: none; }
.ptools .tool { width: 26px; height: 26px; min-width: 0; padding: 0; justify-content: center; }
.psizes { grid-column: 1 / -1; margin-top: 4px; padding: 3px; display: flex; flex-direction: column; gap: 2px; }
.psizes button { border: 0; background: none; height: 12px; display: grid; place-items: center; cursor: pointer; }
.psizes button.on { background: var(--sel); }
.psizes button i { display: block; background: var(--ink); width: 70%; border-radius: 2px; }
.psizes button.on i { background: #fff; }
.pcanvas { flex: 1; min-width: 0; background: var(--lo); padding: 4px; }
.pcanvas canvas { background: #fff; display: block; touch-action: none; cursor: crosshair; box-shadow: 1px 1px 0 var(--dk); }
.palette { display: flex; gap: 4px; align-items: center; padding: 3px 2px; flex: none; }
.pcur { width: 30px; height: 30px; position: relative; flex: none; }
.pcur i { position: absolute; width: 16px; height: 16px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); }
.pcur .fg { left: 3px; top: 3px; z-index: 1; } .pcur .bg2 { left: 11px; top: 11px; }
.swatches { display: grid; grid-template-columns: repeat(14, 15px); grid-template-rows: 15px 15px; gap: 1px; }
.swatches button { border: 0; padding: 0; cursor: pointer; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk); }

/* ---------- Minesweeper ---------- */
.mines { padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.mhead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; align-self: stretch; }
.lcd { background: #000; color: #ff2a2a; font: 30px/26px var(--mono); padding: 0 3px; min-width: 42px; text-align: right; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.smiley { width: 30px; height: 30px; border: 0; padding: 0; background: var(--face); cursor: pointer; display: grid; place-items: center; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }
.smiley:active { box-shadow: inset 1px 1px var(--lo); }
.smiley img { width: 22px; height: 22px; }
.mgrid { display: grid; padding: 3px; overflow: auto; max-width: 100%; }
.mc { width: 22px; height: 22px; border: 0; padding: 0; background: var(--face); font: 700 15px/22px var(--ui); display: grid; place-items: center; cursor: default; box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--hi), inset -2px -2px var(--lo); }
.mc.open { box-shadow: inset 1px 1px var(--lo); background: var(--face); }
.mc.boom { background: #ff2a2a; }
.mc img { width: 16px; height: 16px; }
.n1 { color: #0000ff } .n2 { color: #007b00 } .n3 { color: #ff0000 } .n4 { color: #00007b } .n5 { color: #7b0000 } .n6 { color: #007b7b } .n7 { color: #000 } .n8 { color: #7b7b7b }
.mflag { font-size: 11px; display: flex; gap: 6px; align-items: center; }

/* ---------- Solitaire ---------- */
.felt { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--felt) radial-gradient(circle at 50% 20%, rgba(255,255,255,.12), transparent 70%); touch-action: none; }
.card { position: absolute; border-radius: 5px; background: #fff; box-shadow: 0 0 0 1px #111, 1px 2px 2px rgba(0,0,0,.35); cursor: pointer; touch-action: none; font: 700 15px/1 var(--ui); }
.card.red { color: #d01818; } .card.black { color: #111; }
.card .cr { position: absolute; left: 4px; top: 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 14px; }
.card .cr2 { left: auto; top: auto; right: 4px; bottom: 4px; transform: rotate(180deg); }
.card .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; }
.card .pip.face { font: 700 22px/1 var(--serif); }
.card.back { background: #fff; }
.card.back::after { content: ""; position: absolute; inset: 4px; border-radius: 3px; background: repeating-linear-gradient(45deg, #1d8b98 0 3px, #0b3a68 3px 6px), #0b3a68; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #0b3a68; }
.card.lift { box-shadow: 0 0 0 1px #111, 4px 8px 12px rgba(0,0,0,.4); }
.slot { position: absolute; border-radius: 5px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); }
.slot.f::after { content: "A"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.3); font: 700 22px var(--serif); }
.slot.stock::after { content: "↻"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.4); font-size: 26px; }
.solwin { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Snake ---------- */
.snake { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #111a10; padding: 6px; }
.snake canvas { max-width: 100%; max-height: 100%; touch-action: none; background: #9bbc0f; box-shadow: 0 0 0 3px #0f380f; }
.snake .info { color: #9bbc0f; font: 20px/1 var(--mono); display: flex; gap: 18px; }
.pad { display: none; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 36px); gap: 4px; }
.pad button { border: 0; border-radius: 6px; background: #2a3b22; color: #9bbc0f; font-size: 18px; }
.pad .u { grid-column: 2; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .pad { display: grid; } }

/* ---------- Terminal ---------- */
.term { flex: 1; min-height: 0; background: var(--term); color: var(--termtxt); font: 20px/1.05 var(--mono); padding: 6px 8px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; user-select: text; -webkit-user-select: text; }
.term .in { display: flex; }
.term input { flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; outline: none; padding: 0; caret-color: var(--termtxt); }
.term .dim { opacity: .65; } .term .err { color: #ff8f8f; } .term .hot { color: #ffe08a; }

/* ---------- Browser ---------- */
.web { flex: 1; min-height: 0; overflow: auto; background: #fff; font: 15px/1.35 var(--serif); color: #000; user-select: text; -webkit-user-select: text; }
.web a { color: var(--link); cursor: pointer; } .web a:visited { color: var(--visited); }
.web .loadmask { position: sticky; top: 0; height: 0; }
.brand { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 34px; flex: none; }
.globe { width: 30px; height: 30px; display: grid; place-items: center; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); background: #000; }
.globe img { width: 24px; height: 24px; }
.progress { width: 120px; height: 14px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 2px; flex: none !important; }
.progress i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--sel) 0 8px, transparent 8px 10px); width: 0; }

/* ---------- Music ---------- */
.amp { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: linear-gradient(#2b2f3a, #1a1d25); color: #cfe3ff; }
.ampscreen { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; background: #000; padding: 6px; box-shadow: inset 1px 1px #000, inset -1px -1px #555; }
.amptime { font: 34px/30px var(--mono); color: #5cff8a; text-shadow: 0 0 6px rgba(92,255,138,.5); }
.ampmarq { font: 18px/20px var(--mono); color: #5cff8a; white-space: nowrap; overflow: hidden; }
.ampinfo { font: 14px var(--mono); color: #9ad3ff; display: flex; gap: 10px; }
.ampviz { grid-column: 1 / -1; height: 54px; width: 100%; display: block; }
.ampctl { display: flex; gap: 3px; align-items: center; }
.ampctl button { width: 30px; height: 22px; border: 0; padding: 0; background: linear-gradient(#5b6170, #3a3f4c); color: #e8f0ff; border-radius: 2px; box-shadow: inset 0 1px rgba(255,255,255,.25), 0 1px #000; cursor: pointer; font-size: 11px; }
