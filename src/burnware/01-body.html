
<div id="screen" aria-label="Burnware desktop">
  <main id="desk">
    <canvas id="wall" aria-hidden="true"></canvas>
    <div id="icons" role="list" aria-label="Desktop"></div>
    <div id="tuko" hidden></div>
  </main>
  <footer id="taskbar">
    <button id="start" aria-haspopup="menu" aria-expanded="false"><img alt="" id="startIco">Start</button>
    <div id="tasks" role="list" aria-label="Open windows"></div>
    <div id="tray"><button id="vol" aria-label="Sound on" title="Volume"><img alt="" id="volIco"></button><button id="net" title="Connected at 56.6 Kbps" aria-label="Network"><img alt="" id="netIco"></button><span id="clock"></span></div>
    <div id="startmenu" hidden role="menu"></div>
  </footer>
</div>
<div id="power" class="over"><div><button id="powerBtn" aria-label="Turn the computer on"><svg viewBox="0 0 24 24" fill="none" stroke="#5cff8a" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg></button>press the button to turn on<br><small style="font-size:15px;color:#555">(it has sound)</small></div></div>
