<style>
/* Burnware: a late-90s desktop. One deliberate look (grey bevelled chrome on a teal desk), so a single
   light palette; every colour is a token here. Layout: a full-screen desk above a 32px taskbar. */
:root {
  color-scheme: light;
  --face: #c3c3c3; --face2: #d4d0c8; --hi: #ffffff; --lo: #808080; --dk: #0a0a0a; --mid: #dfdfdf;
  --t1: #5c1408; --t2: #e2642c; --ti1: #808080; --ti2: #b9b9b9; --ttxt: #ffffff;
  --desk: #2a1620; --ink: #000000; --sel: #8a2410; --seltxt: #ffffff; --tip: #ffffe1; --field: #ffffff;
  --link: #0000ee; --visited: #551a8b; --felt: #18753a; --term: #0c0c0c; --termtxt: #b9f5c4; --bsod: #0000aa;
  --ui: Tahoma, Verdana, "Segoe UI", "DejaVu Sans", sans-serif;
  --mono: "VT323", "Lucida Console", "Courier New", monospace;
  --pix: "Silkscreen", "VT323", monospace;
  --comic: "Comic Neue", "Comic Sans MS", cursive;
  --serif: "Times New Roman", Times, Georgia, serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { background: var(--dk); color: var(--ink); font: 12px/1.35 var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button, input, textarea, select { font: inherit; color: inherit; }
textarea, input[type=text], input[type=password], [contenteditable] { user-select: text; -webkit-user-select: text; }
img, canvas { image-rendering: pixelated; }
.bev { background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }
.sunk { box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--mid); }
.field { background: var(--field); box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk), inset -2px -2px var(--mid); border: 0; padding: 3px 5px; outline: none; }
.btn { background: var(--face); border: 0; min-width: 72px; min-height: 23px; padding: 3px 10px; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); cursor: pointer; }
.btn:active, .btn.on { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--mid); padding: 4px 9px 2px 11px; }
.btn:focus-visible, .tool:focus-visible, .icon:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
.btn[disabled] { color: var(--lo); text-shadow: 1px 1px var(--hi); cursor: default; }
.btn.def { box-shadow: inset 0 0 0 1px var(--dk), inset -2px -2px var(--dk), inset 2px 2px var(--hi), inset -3px -3px var(--lo), inset 3px 3px var(--mid); }
hr.groove { border: 0; border-top: 1px solid var(--lo); border-bottom: 1px solid var(--hi); margin: 4px 2px; }

/* ---------- the screen ---------- */
#screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--desk); }
#desk { position: relative; flex: 1; overflow: hidden; }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: auto; }
#icons { position: absolute; top: 10px; bottom: 6px; left: var(--gl); right: var(--gr); display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 78px); grid-auto-columns: 78px; gap: 2px 6px; align-content: start; pointer-events: none; }
.icon { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; width: 78px; border: 0; background: none; color: #fff; cursor: pointer; text-align: center; }
.icon img { width: 32px; height: 32px; }
.icon span { font-size: 11px; line-height: 1.2; padding: 1px 2px; text-shadow: 1px 1px 0 #000; max-width: 76px; overflow-wrap: break-word; }
.icon.sel span { background: var(--sel); color: var(--seltxt); text-shadow: none; outline: 1px dotted #fff; }
.icon.sel img { filter: brightness(.65) sepia(1) hue-rotate(170deg) saturate(3); }

/* ---------- windows ---------- */
.win { position: absolute; display: flex; flex-direction: column; padding: 3px; min-width: 200px; min-height: 120px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 3px 10px rgba(0,0,0,.25); }
.win.max { left: var(--gl) !important; right: var(--gr) !important; top: 0 !important; bottom: 0 !important; width: auto !important; height: auto !important; }
.win.min { display: none; }
.tb { display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 2px 0 3px; background: linear-gradient(90deg, var(--t1), var(--t2)); color: var(--ttxt); font-weight: 700; flex: none; cursor: default; touch-action: none; }
.win.inactive .tb { background: linear-gradient(90deg, var(--ti1), var(--ti2)); color: #d8d8d8; }
.tb img { width: 16px; height: 16px; flex: none; }
.tb .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbb { width: 18px; height: 16px; padding: 0; border: 0; flex: none; display: grid; place-items: center; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); cursor: pointer; color: var(--ink); }
.tbb:active { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo); }
.tbb svg { width: 10px; height: 10px; display: block; }
.tbb.x { margin-left: 2px; }
.menubar { display: flex; gap: 0; padding: 1px 0; flex: none; position: relative; }
.menubar > button { border: 0; background: none; padding: 2px 7px; cursor: pointer; }
.menubar > button:hover, .menubar > button.open { background: var(--sel); color: var(--seltxt); }
.dropdown { position: absolute; z-index: 5; min-width: 160px; padding: 2px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.25); }
.dropdown button { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0; background: none; padding: 3px 18px 3px 20px; text-align: left; cursor: pointer; white-space: nowrap; }
.dropdown button:hover:not([disabled]) { background: var(--sel); color: var(--seltxt); }
.dropdown button[disabled] { color: var(--lo); text-shadow: 1px 1px var(--hi); }
.dropdown small { opacity: .8; }
.wbody { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.grip { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 50%, var(--lo) 50%, var(--lo) 56%, var(--hi) 56%, var(--hi) 62%, transparent 62%, transparent 70%, var(--lo) 70%, var(--lo) 76%, var(--hi) 76%, var(--hi) 82%, transparent 82%); }
.win.max .grip { display: none; }
.status { display: flex; gap: 2px; flex: none; margin-top: 2px; }
.status > * { flex: 1; padding: 1px 4px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar { display: flex; gap: 2px; align-items: center; padding: 2px; flex: none; flex-wrap: wrap; }
.tool { border: 0; background: var(--face); min-width: 24px; height: 24px; padding: 2px 6px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.tool:hover { box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--hi); }
.tool:active, .tool.on { box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); background: var(--mid); }
.tool img { width: 16px; height: 16px; }

/* ---------- taskbar ---------- */
#taskbar { position: relative; flex: none; height: 32px; padding: 2px var(--gr) calc(2px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; gap: 4px; align-items: center; background: var(--face); box-shadow: inset 0 1px var(--face2), inset 0 2px var(--hi); z-index: 9000; box-sizing: content-box; }
#start { display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px 0 4px; font-weight: 700; border: 0; background: var(--face); cursor: pointer; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); flex: none; }
#start.on { box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo), inset -2px -2px var(--mid); }
#start img { width: 18px; height: 18px; }
#tasks { flex: 1; min-width: 0; display: flex; gap: 3px; overflow: hidden; }
.task { flex: 0 1 160px; min-width: 32px; height: 24px; display: flex; align-items: center; gap: 4px; padding: 0 6px; border: 0; background: var(--face); cursor: pointer; text-align: left; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }
.task span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task img { width: 16px; height: 16px; flex: none; }
.task.on { font-weight: 700; background: repeating-conic-gradient(var(--hi) 0 25%, var(--mid) 0 50%) 0 0 / 2px 2px; box-shadow: inset 1px 1px var(--dk), inset -1px -1px var(--hi), inset 2px 2px var(--lo); }
#tray { flex: none; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 6px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); }
#tray button { border: 0; background: none; padding: 0; cursor: pointer; display: grid; }
#tray img { width: 16px; height: 16px; }
#clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
#startmenu { position: absolute; left: var(--gl); bottom: 100%; margin-bottom: -2px; display: flex; padding: 3px; z-index: 9001; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.25); }
#startmenu .side { width: 24px; background: linear-gradient(0deg, var(--t1), var(--t2)); color: #fff; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
#startmenu .side b { writing-mode: vertical-rl; transform: rotate(180deg); font: 700 17px/1 var(--pix); letter-spacing: 1px; }
#startmenu .side b i { font-style: normal; color: #ffd46a; }
#startmenu .items { display: flex; flex-direction: column; min-width: 196px; }
.smi { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 18px 4px 6px; text-align: left; cursor: pointer; position: relative; }
.smi img { width: 32px; height: 32px; }
.smi.small img { width: 16px; height: 16px; }
.smi:hover, .smi.open { background: var(--sel); color: var(--seltxt); }
.smi .arrow { position: absolute; right: 6px; }
.submenu { position: absolute; left: 100%; top: 0; display: flex; flex-direction: column; padding: 2px; min-width: 190px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--face2), inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.25); z-index: 2; }
.submenu .smi { padding: 3px 18px 3px 6px; color: var(--ink); }
.submenu .smi:hover { color: var(--seltxt); }

/* ---------- dialogs and bits ---------- */
.dlg { display: flex; gap: 14px; padding: 14px 12px 8px; align-items: flex-start; }
.dlg img { width: 32px; height: 32px; flex: none; }
.dlg p { margin: 0 0 6px; max-width: 46ch; }
.dlgbtns { display: flex; gap: 8px; justify-content: center; padding: 8px 10px 10px; flex-wrap: wrap; }
#tuko.talking { z-index: 8000; }
.tip { position: absolute; background: var(--tip); border: 1px solid var(--ink); padding: 2px 5px; z-index: 9500; pointer-events: none; white-space: nowrap; }
.ctx { position: absolute; z-index: 9200; }
.scroller { overflow: auto; min-height: 0; flex: 1; }
.scroller::-webkit-scrollbar { width: 16px; height: 16px; background: repeating-conic-gradient(var(--hi) 0 25%, var(--face) 0 50%) 0 0 / 2px 2px; }
.scroller::-webkit-scrollbar-thumb { background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }

/* ---------- Explorer ---------- */
.addr { display: flex; gap: 4px; align-items: center; padding: 2px 4px; flex: none; }
.addr .field { flex: 1; min-width: 0; height: 21px; box-sizing: border-box; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 4px; padding: 8px; align-content: start; background: var(--field); }
.fitem { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 4px 2px; cursor: pointer; text-align: center; }
.fitem img { width: 32px; height: 32px; }
.fitem span { font-size: 11px; padding: 0 2px; overflow-wrap: anywhere; }
.fitem.sel span { background: var(--sel); color: var(--seltxt); }
.fitem.sel img { filter: brightness(.65) sepia(1) hue-rotate(170deg) saturate(3); }
.empty-note { padding: 18px; color: var(--lo); grid-column: 1 / -1; text-align: center; }

/* ---------- Notepad ---------- */
.note { flex: 1; min-height: 0; resize: none; font: 13px/1.4 "Lucida Console", "Courier New", monospace; padding: 4px 6px; white-space: pre-wrap; }
.note.nowrap { white-space: pre; overflow-x: auto; }

/* ---------- Paint ---------- */
.paint { display: flex; flex: 1; min-height: 0; gap: 2px; }
.ptools { display: grid; grid-template-columns: 26px 26px; gap: 1px; align-content: start; padding: 2px; flex: none; }
.ptools .tool { width: 26px; height: 26px; min-width: 0; padding: 0; justify-content: center; }
.psizes { grid-column: 1 / -1; margin-top: 4px; padding: 3px; display: flex; flex-direction: column; gap: 2px; }
.psizes button { border: 0; background: none; height: 12px; display: grid; place-items: center; cursor: pointer; }
.psizes button.on { background: var(--sel); }
.psizes button i { display: block; background: var(--ink); width: 70%; border-radius: 2px; }
.psizes button.on i { background: #fff; }
.pcanvas { flex: 1; min-width: 0; background: var(--lo); padding: 4px; }
.pcanvas canvas { background: #fff; display: block; touch-action: none; cursor: crosshair; box-shadow: 1px 1px 0 var(--dk); }
.palette { display: flex; gap: 4px; align-items: center; padding: 3px 2px; flex: none; }
.pcur { width: 30px; height: 30px; position: relative; flex: none; }
.pcur i { position: absolute; width: 16px; height: 16px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); }
.pcur .fg { left: 3px; top: 3px; z-index: 1; } .pcur .bg2 { left: 11px; top: 11px; }
.swatches { display: grid; grid-template-columns: repeat(14, 15px); grid-template-rows: 15px 15px; gap: 1px; }
.swatches button { border: 0; padding: 0; cursor: pointer; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi), inset 2px 2px var(--dk); }

/* ---------- Minesweeper ---------- */
.mines { padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.mhead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; align-self: stretch; }
.lcd { background: #000; color: #ff2a2a; font: 30px/26px var(--mono); padding: 0 3px; min-width: 42px; text-align: right; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.smiley { width: 30px; height: 30px; border: 0; padding: 0; background: var(--face); cursor: pointer; display: grid; place-items: center; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px var(--mid); }
.smiley:active { box-shadow: inset 1px 1px var(--lo); }
.smiley img { width: 22px; height: 22px; }
.mgrid { display: grid; padding: 3px; overflow: auto; max-width: 100%; }
.mc { width: 22px; height: 22px; border: 0; padding: 0; background: var(--face); font: 700 15px/22px var(--ui); display: grid; place-items: center; cursor: default; box-shadow: inset -1px -1px var(--lo), inset 1px 1px var(--hi), inset -2px -2px var(--lo); }
.mc.open { box-shadow: inset 1px 1px var(--lo); background: var(--face); }
.mc.boom { background: #ff2a2a; }
.mc img { width: 16px; height: 16px; }
.n1 { color: #0000ff } .n2 { color: #007b00 } .n3 { color: #ff0000 } .n4 { color: #00007b } .n5 { color: #7b0000 } .n6 { color: #007b7b } .n7 { color: #000 } .n8 { color: #7b7b7b }
.mflag { font-size: 11px; display: flex; gap: 6px; align-items: center; }

/* ---------- Solitaire ---------- */
.felt { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--felt) radial-gradient(circle at 50% 20%, rgba(255,255,255,.12), transparent 70%); touch-action: none; }
.card { position: absolute; border-radius: 5px; background: #fff; box-shadow: 0 0 0 1px #111, 1px 2px 2px rgba(0,0,0,.35); cursor: pointer; touch-action: none; font: 700 15px/1 var(--ui); }
.card.red { color: #d01818; } .card.black { color: #111; }
.card .cr { position: absolute; left: 4px; top: 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 14px; }
.card .cr2 { left: auto; top: auto; right: 4px; bottom: 4px; transform: rotate(180deg); }
.card .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; }
.card .pip.face { font: 700 22px/1 var(--serif); }
.card.back { background: #fff; }
.card.back::after { content: ""; position: absolute; inset: 4px; border-radius: 3px; background: repeating-linear-gradient(45deg, #1d8b98 0 3px, #0b3a68 3px 6px), #0b3a68; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #0b3a68; }
.card.lift { box-shadow: 0 0 0 1px #111, 4px 8px 12px rgba(0,0,0,.4); }
.slot { position: absolute; border-radius: 5px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); }
.slot.f::after { content: "A"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.3); font: 700 22px var(--serif); }
.slot.stock::after { content: "↻"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.4); font-size: 26px; }
.solwin { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Snake ---------- */
.snake { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #111a10; padding: 6px; }
.snake canvas { max-width: 100%; max-height: 100%; touch-action: none; background: #9bbc0f; box-shadow: 0 0 0 3px #0f380f; }
.snake .info { color: #9bbc0f; font: 20px/1 var(--mono); display: flex; gap: 18px; }
.pad { display: none; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 36px); gap: 4px; }
.pad button { border: 0; border-radius: 6px; background: #2a3b22; color: #9bbc0f; font-size: 18px; }
.pad .u { grid-column: 2; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .pad { display: grid; } }

/* ---------- Terminal ---------- */
.term { flex: 1; min-height: 0; background: var(--term); color: var(--termtxt); font: 20px/1.05 var(--mono); padding: 6px 8px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; user-select: text; -webkit-user-select: text; }
.term .in { display: flex; }
.term input { flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; outline: none; padding: 0; caret-color: var(--termtxt); }
.term .dim { opacity: .65; } .term .err { color: #ff8f8f; } .term .hot { color: #ffe08a; }

/* ---------- Browser ---------- */
.web { flex: 1; min-height: 0; overflow: auto; background: #fff; font: 15px/1.35 var(--serif); color: #000; user-select: text; -webkit-user-select: text; }
.web a { color: var(--link); cursor: pointer; } .web a:visited { color: var(--visited); }
.web .loadmask { position: sticky; top: 0; height: 0; }
.brand { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 34px; flex: none; }
.globe { width: 30px; height: 30px; display: grid; place-items: center; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); background: #000; }
.globe img { width: 24px; height: 24px; }
.progress { width: 120px; height: 14px; box-shadow: inset 1px 1px var(--lo), inset -1px -1px var(--hi); padding: 2px; flex: none !important; }
.progress i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--sel) 0 8px, transparent 8px 10px); width: 0; }

/* ---------- Music ---------- */
.amp { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: linear-gradient(#2b2f3a, #1a1d25); color: #cfe3ff; }
.ampscreen { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; background: #000; padding: 6px; box-shadow: inset 1px 1px #000, inset -1px -1px #555; }

/* ============================================================
   System sounds, synthesized: the startup chime, clicks, dings,
   a dial-up modem, a crumpled-paper recycle bin, little jingles.
   ============================================================ */
const Sound = (() => {
  let ctx = null, master = null, on = true;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = on ? 0.6 : 0; master.connect(ctx.destination);
  }
  const now = () => ctx.currentTime;
  function tone(f, t0, dur, { type = 'sine', vol = 0.2, attack = 0.01, slide = 0, to = master, release = null } = {}) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (release || dur));
    o.connect(g); g.connect(to); o.start(t0); o.stop(t0 + (release || dur) + 0.05);
  }
  function noise(t0, dur, { vol = 0.2, freq = 1200, q = 0.8, type = 'bandpass' } = {}) {
    if (!ctx) return;
    const n = Math.ceil(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur);
  }
  // a soft wash of echo for the chimes
  function echoBus() {
    const d = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain(), lp = ctx.createBiquadFilter();
    d.delayTime.value = 0.23; fb.gain.value = 0.38; wet.gain.value = 0.5; lp.type = 'lowpass'; lp.frequency.value = 2600;
    const inp = ctx.createGain(); inp.connect(master); inp.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(master);
    return inp;
  }
  return {
    init, get ctx() { return ctx; }, get on() { return on; },
    setOn(v) { on = v; if (master) master.gain.value = v ? 0.6 : 0; },
    startup() {   // a warm major-seventh bloom, then a sparkle

const Files = {
  openFile(path) {
    const n = FS.resolve(path); if (!n) return WM.alert('Error', `Cannot find '${path}'.`, 'err');
    if (n.type === 'dir') return WM.open('explorer', { path });
    if (n.kind === 'app') return WM.open(n.app);
    if (n.kind === 'img') return WM.open('paint', { path });
    if (n.kind === 'snd') return WM.open('music', { track: n.track });
    if (n.kind === 'vid') return WM.open('video', { src: n.src, title: n.name });
    if (n.kind === 'sys') return WM.ask('Open System File', `${n.name} is a system file. Burnware needs it to keep running.\nOpening it is fine. Editing it is how blue screens are made.`, ['Open anyway', 'Cancel'], 'warn').then(r => { if (r === 'Open anyway') WM.open('notepad', { path }); });
    return WM.open('notepad', { path });
  },
  unlock(path) {
    return WM.prompt('Private', 'This folder is password protected.\nPassword:', '', 'password').then(v => {
      if (v === null) return false;
      const ok = ['lamok', 'mosquito', 'mosquitos', 'mosquitoes'].includes(v.trim().toLowerCase());
      if (!ok) { WM.alert('Access denied', 'That is not the password.\n(Hint: someone small and green talks about it a lot.)', 'err'); return false; }
      const n = FS.resolve(path); n.locked = false; FS.save(); Store.data.secret = true; Store.save();
      Sound.tada(); Tuko.say('You got in! I told you. I really do love lamok. A new wallpaper is waiting for you in Display Properties.', 9000);
      return true;
    });
  },
};

/* ============================================================
   The time machine. Click the clock to pick the year Burnware
   lives in; SparkNet News in Torch then shows real
   headlines from that year, read live from the Events section of
   Wikipedia's article about it (and kept in this browser after).
   ============================================================ */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const News = {
  mem: {}, MIN: 1000,
  max() { return new Date().getFullYear(); },
  year() { const y = +Store.data.year; return y >= this.MIN && y <= this.max() ? y : 1998; },
  setYear(y) { y = clamp(Math.round(+y || 1998), this.MIN, this.max()); Store.data.year = y; Store.save(); Clock.tick(); return y; },
  dateString(d = new Date()) { return `${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date(this.year(), d.getMonth(), d.getDate()).getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${this.year()}`; },
  async get(y) {
    if (this.mem[y]) return this.mem[y];
    const key = 'burnware-news-' + y;
    try { const s = localStorage.getItem(key); if (s) { const v = JSON.parse(s); if (v && v.length) return (this.mem[y] = v); } } catch (e) { /* no storage: just fetch */ }
    const base = 'https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=parse&redirects=1&page=' + encodeURIComponent(String(y));
    const sec = await (await fetch(base + '&prop=sections')).json();
    const list = (sec.parse && sec.parse.sections) || [], plain = (s) => String(s.line || '').replace(/<[^>]+>/g, '').trim();
    const ev = list.find(s => /^events$/i.test(plain(s)) && +s.toclevel === 1) || list.find(s => /^events/i.test(plain(s)));
    if (!ev) throw new Error('This year has no events list on Wikipedia.');
    const res = await (await fetch(base + '&prop=text&disableeditsection=1&disabletoc=1&section=' + ev.index)).json();
    const out = this.parse((res.parse && res.parse.text) || '');
    if (!out.length) throw new Error('No headlines found for this year.');
    this.mem[y] = out;
    try { localStorage.setItem(key, JSON.stringify(out)); } catch (e) { /* full: keep it for this visit only */ }
    return out;
  },
  /* turn the article's lists into {group, date, text}: a heading per month, a bullet per event */
  parse(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html'), root = doc.querySelector('.mw-parser-output') || doc.body, out = [];
    let group = '';
    const clean = (el) => { const c = el.cloneNode(true); c.querySelectorAll('ul, ol, sup, style, link, figure, table, .mw-editsection, .reference, .noprint').forEach(x => x.remove()); return c.textContent.replace(/\[[^\]]{0,12}\]/g, '').replace(/\s+/g, ' ').trim(); };
    const push = (date, text) => { text = text.replace(/^[–—:\s]+/, ''); if (text.length < 10) return; out.push({ group, date: date.trim(), text: text.length > 260 ? text.slice(0, 257).replace(/\s+\S*$/, '') + '…' : text }); };
    const split = (s) => { const m = s.match(/^(.{3,40}?)\s+[–—]\s+(.+)$/); return m ? [m[1], m[2]] : null; };
    const item = (li) => {
      const own = clean(li), sub = [...li.children].find(c => c.tagName === 'UL'), sp = split(own);
      if (sub) { let date = own; if (sp) { push(sp[0], sp[1]); date = sp[0]; } for (const s of sub.children) if (s.tagName === 'LI') { const t = clean(s), sp2 = split(t); if (sp2) push(sp2[0], sp2[1]); else push(date, t); } }

/* ============================================================
   The desktop, take two: icons sit on a grid you can rearrange,
   your own folders and files live in C:\Desktop, and right-click
   (or long-press) gives you New Folder and friends.
   This file: layout, rendering, rename, delete and moving files.
   89-desktop-input.js does the mouse and finger work.
   ============================================================ */
const Desk = {
  key: 'burnware-desk-v1', dir: 'C:\\Desktop', pos: {}, cells: {}, sel: new Set(), els: new Map(), items: [], sig: '', renaming: null,
  load() { try { this.pos = JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { this.pos = {}; } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.pos)); } catch (e) {} },
  pitch() { return matchMedia('(max-width: 720px)').matches ? [78, 78] : [84, 80]; },
  dims() {
    const r = $('#icons').getBoundingClientRect(), [px, py] = this.pitch();
    return { cols: Math.max(1, Math.floor((r.width + 6) / px)), rows: Math.max(1, Math.floor((r.height + 2) / py)), px, py, r };
  },
  folder() { return FS.resolve(this.dir) || FS.mkdir(this.dir); },
  /* everything on the desktop: the built-in shortcuts, then whatever is in C:\Desktop */
  list() {
    const apps = Desktop.items.map(it => ({ key: 'app:' + it.label, label: it.label, icon: typeof it.icon === 'function' ? it.icon() : it.icon, open: it.open, app: it }));
    const d = this.folder(), own = d ? d.children.map(n => { const path = FS.join(this.dir, n.name); return { key: 'fs:' + n.name, label: n.name, icon: FS.iconFor(n), node: n, path, open: () => Files.openFile(path) }; }) : [];

  },
  signature() { const d = this.folder(); return (d ? d.children.map(n => n.name + (n.type === 'dir' ? '/' : '')).join('|') : '') + '#' + FS.bin.length; },
  get(key) { return this.items.find(i => i.key === key); },
  /* where every icon goes: saved spots first, then the first free cell, column by column */
  layout() {
    const { cols, rows } = this.dims(), taken = new Set(), cells = {};

  },
};
/* ---- 89-desktop-input.js ---- */
/* ============================================================
   Desktop mouse and finger work: click to select, drag a box to
   select many, drag icons to move them (or drop them on a folder
   or the Recycle Bin), right-click / long-press for menus, and
   Delete, F2, Ctrl+A on the keyboard.
   ============================================================ */
const DeskInput = {
  touchAt: 0,
  dropTargets() { return { 'app:Recycle Bin': 'BIN', 'app:My Documents': 'C:\\My Documents' }; },
  wire(b, it) {
    let st = null;
    const pt = (e) => [e.clientX, e.clientY];
    b.addEventListener('pointerdown', (e) => {
      if (e.target.closest('input')) return;
      if (e.pointerType !== 'mouse') this.touchAt = Date.now();
      const add = e.ctrlKey || e.metaKey, was = Desk.sel.has(it.key);
      if (e.button === 2) { if (!was) Desk.select([it.key]); return; }
      if (e.button !== 0) return;
      if (add) Desk.select(was ? [...Desk.sel].filter(k => k !== it.key) : [...Desk.sel, it.key]);
      else if (e.shiftKey) Desk.select([it.key], true);
      else if (!was) Desk.select([it.key]);
      if (!Desk.sel.has(it.key)) return;
      st = { id: e.pointerId, p: pt(e), moved: false, touch: e.pointerType !== 'mouse', add: add || e.shiftKey, drag: null };
      try { b.setPointerCapture(e.pointerId); } catch (_) {}
      if (st.touch) st.lp = setTimeout(() => { if (st && !st.moved) { st.menu = true; Sound.click(); this.iconMenu(it, st.p[0], st.p[1]); } }, 550);
    });
    b.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id || st.menu) return;
      const dx = e.clientX - st.p[0], dy = e.clientY - st.p[1];
      if (!st.moved && Math.hypot(dx, dy) > (st.touch ? 10 : 4)) { st.moved = true; clearTimeout(st.lp); st.drag = this.startDrag(it); }
      if (st.drag) this.dragTo(st.drag, dx, dy, e.clientX, e.clientY);
    });
    const up = (e, cancel) => {
      if (!st || e.pointerId !== st.id) return;
      const s = st; st = null; clearTimeout(s.lp);
      if (s.menu) { TapShield.until = Date.now() + 350; return; }
      if (s.drag) return cancel ? Desk.render() : this.drop(s.drag, e.clientX, e.clientY);
      if (cancel) return;
      if (!s.add) Desk.select([it.key]);
      if (s.touch) { TapShield.until = Date.now() + 450; Desk.launch(it); }
    };
    b.addEventListener('pointerup', (e) => up(e, false));
    b.addEventListener('pointercancel', (e) => up(e, true));
    b.addEventListener('dblclick', () => { if (!isTouch() || Date.now() - this.touchAt > 1500) Desk.launch(it); });
    b.addEventListener('click', (e) => e.preventDefault());
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.target.closest('input')) Desk.launch(it); });
    b.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (Date.now() - this.touchAt < 1500) return;   // a long-press already opened the menu
      this.iconMenu(it, e.clientX, e.clientY);
    });
  },
  /* ---------- dragging icons ---------- */
  startDrag(it) {
    const keys = [...Desk.sel], els = keys.map(k => Desk.els.get(k)).filter(Boolean);
    els.forEach(el => el.classList.add('drag'));
    return { it, keys, els, target: null };
  },
  dragTo(d, dx, dy, x, y) {
    for (const el of d.els) el.style.transform = `translate(${dx}px, ${dy}px)`;
    d.dx = dx; d.dy = dy;
    const t = this.targetAt(d, x, y);
    if (t !== d.target) { if (d.target) d.target.el.classList.remove('drop'); d.target = t; if (t) t.el.classList.add('drop'); }
  },
  under(d, x, y) { return document.elementsFromPoint(x, y).find(el => !d.els.some(i => i.contains(el))) || null; },
  /* what's under the finger: a folder or the bin we can drop into, or nothing */
  targetAt(d, x, y) {
    const el = this.under(d, x, y), ic = el && el.closest('.icon');
    if (!ic) return null;
    const key = ic.dataset.key, it = Desk.get(key); if (!it) return null;
    const special = this.dropTargets()[key];
    if (special) return { el: ic, key, path: special };
    if (it.node && it.node.type === 'dir') return { el: ic, key, path: it.path };
    return null;
  },
  async drop(d, x, y) {
    const mine = d.keys.filter(k => { const it = Desk.get(k); return it && it.node; });
    if (d.target) {
      d.target.el.classList.remove('drop');
      if (d.target.path === 'BIN') { Desk.render(); return Desk.remove(d.keys); }
      if (mine.length && Desk.moveInto(mine, d.target.path)) return;
      return Desk.render();
    }
    const under = this.under(d, x, y);
    if (!under || !under.closest('#desk') || under.closest('.win')) return Desk.render();   // dropped on a window or off the desk: back it goes
    /* move the whole group by the same number of cells; anything that lands on a taken spot shuffles to the nearest free one */
    const { cols, rows, px, py } = Desk.dims(), cells = Desk.cells, from = cells[d.it.key];
    const dc = Math.round(d.dx / px), dr = Math.round(d.dy / py);
    const moving = new Set(d.keys), taken = new Set();
    for (const k in cells) if (!moving.has(k)) taken.add(cells[k].join(','));
    const order = d.keys.slice().sort((a, b) => (a === d.it.key ? -1 : b === d.it.key ? 1 : 0));
    for (const k of order) {
      const c = cells[k]; if (!c) continue;
      const want = [clamp(c[0] + dc, 0, cols - 1), clamp(c[1] + dr, 0, rows - 1)];
      const at = taken.has(want.join(',')) ? Desk.nearest(want[0], want[1], (cc, rr) => !taken.has(cc + ',' + rr), cols, rows) : want;
      cells[k] = at; taken.add(at.join(','));
    }
    if (from) Sound.click();
    Desk.freeze(); Desk.render();
  },
  /* ---------- the box select ---------- */
  initDesk() {
    const desk = $('#desk'), bg = (t) => t === desk || t.id === 'wall' || t.id === 'icons';
    let st = null;
    desk.addEventListener('pointerdown', (e) => {
      if (!bg(e.target)) return;
      if (e.pointerType !== 'mouse') this.touchAt = Date.now();
      if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.icon')) document.activeElement.blur();
      if (e.button === 2) { Desk.select([]); return; }
      if (e.button !== 0) return;
      const add = e.ctrlKey || e.metaKey || e.shiftKey;
      if (!add) Desk.select([]);
      const box = $('#icons').getBoundingClientRect();
      st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, box, base: add ? [...Desk.sel] : [], rect: null, touch: e.pointerType !== 'mouse', moved: false };
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      if (st.touch) st.lp = setTimeout(() => { if (st && !st.moved) { st.menu = true; Sound.click(); this.deskMenu(st.x0, st.y0); } }, 550);
    });
    desk.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id || st.menu) return;
      const x = e.clientX, y = e.clientY;
      if (!st.moved && Math.hypot(x - st.x0, y - st.y0) < (st.touch ? 10 : 3)) return;
      if (!st.moved) { st.moved = true; clearTimeout(st.lp); st.rect = h('div.marq'); $('#icons').append(st.rect); }
      const l = Math.min(x, st.x0), t = Math.min(y, st.y0), w = Math.abs(x - st.x0), hh = Math.abs(y - st.y0);
      Object.assign(st.rect.style, { left: l - st.box.left + 'px', top: t - st.box.top + 'px', width: w + 'px', height: hh + 'px' });
      const hit = [];
      for (const [k, el] of Desk.els) {
        const r = el.querySelector('img').getBoundingClientRect(), s = el.querySelector('span,input').getBoundingClientRect();
        const L = Math.min(r.left, s.left), T = r.top, R = Math.max(r.right, s.right), B = s.bottom;
        if (L < l + w && R > l && T < t + hh && B > t) hit.push(k);
      }
      Desk.select(st.base.concat(hit.filter(k => !st.base.includes(k))));
    });
    const end = (e) => { if (!st || e.pointerId !== st.id) return; clearTimeout(st.lp); if (st.menu) TapShield.until = Date.now() + 350; if (st.rect) st.rect.remove(); st = null; };
    desk.addEventListener('pointerup', end); desk.addEventListener('pointercancel', end);
    desk.addEventListener('contextmenu', (e) => {
      if (!bg(e.target)) return;
      e.preventDefault();
      if (Date.now() - this.touchAt < 1500) return;
      this.deskMenu(e.clientX, e.clientY);
    });
    /* keyboard: only when you're on the desktop, not typing in a window */
    addEventListener('keydown', (e) => {
      const a = document.activeElement, onDesk = !a || a === document.body || (a.closest && a.closest('.icon'));
      if (!onDesk || Desk.renaming || !Boot.ready) return;
      const keys = [...Desk.sel];
      if (e.key === 'Delete' && keys.length) { e.preventDefault(); Desk.remove(keys); }
      else if (e.key === 'F2' && keys.length === 1) { e.preventDefault(); Desk.rename(keys[0]); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && a && a.closest && a.closest('.icon')) { e.preventDefault(); Desk.select([...Desk.els.keys()]); }
      else if (e.key === 'Escape' && keys.length && !Start.open) Desk.select([]);
    });
  },
  /* ---------- menus ---------- */
  deskMenu(x, y) {
    WM.ctx(x, y, [
      { label: 'Arrange icons by name', action: () => Desk.arrange('name') },
      { label: 'Arrange icons by type', action: () => Desk.arrange('type') },
      { label: 'Reset icon layout', action: () => Desk.arrange('default') },
      { label: 'Refresh', action: () => { Desk.render(); Wall.paint(); } },
      '-',
      { label: 'New folder', action: () => Desk.create('dir', x, y) },
      { label: 'New text document', action: () => Desk.create('txt', x, y) },
      '-',
      { label: 'Change wallpaper', action: () => WM.open('settings', { tab: 'bg' }) },
      { label: 'Properties', action: () => WM.open('settings') },
    ]);
  },
  iconMenu(it, x, y) {
    const keys = [...Desk.sel], many = keys.length > 1, mineCount = keys.filter(k => { const i = Desk.get(k); return i && i.node; }).length;
    const items = [{ label: 'Open', disabled: many, action: () => Desk.launch(it) }];
    if (it.key === 'app:Recycle Bin') items.push({ label: 'Empty Recycle Bin', disabled: !FS.bin.length, action: () => WM.ask('Confirm', 'Are you sure you want to permanently delete everything in the Recycle Bin?', ['Yes', 'No'], 'warn').then(r => { if (r === 'Yes') { FS.emptyBin(); Desk.render(); } }) });
    if (mineCount) {
      items.push('-');
      if (!many && it.node) items.push({ label: 'Rename', action: () => Desk.rename(it.key) });
      items.push({ label: many ? `Delete ${mineCount} item${mineCount === 1 ? '' : 's'}` : 'Delete', action: () => Desk.remove(keys) });
      if (!many && it.node) items.push('-', { label: 'Properties', action: () => Desk.props(it) });
    }
    WM.ctx(x, y, items);
  },
};

/* swap the old fixed-grid desktop for this one */
Desktop.render = () => Desk.render();
Desktop.init = () => {
  Desk.load(); Desk.render(); DeskInput.initDesk();
  const save = FS.save.bind(FS); FS.save = function () { save(); Desk.changed(); };
  let t = 0; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { if (!Desk.renaming) Desk.render(); }, 150); });
};
/* ---- 90-boot.js ---- */
/* ============================================================
   Power on, the BIOS check, the splash, shutting down, and the
   blue screen you get for deleting the wrong thing.
   ============================================================ */
const Boot = {
  ready: false,
  async powerOn(fast) {
    this.ready = false;
    $('#power')?.remove();
    Sound.init();
    if (!fast && !calm()) await this.bios();
    await this.splash(fast ? 450 : 1300);
    this.ready = true;
    Sound.startup();
    Desktop.render(); Wall.paint();
    if (Store.data.firstBoot) {
      Store.data.firstBoot = false; Store.save();
      setTimeout(() => Tuko.say('Hi! I am Tuko, your desktop gecko. Double-click (or tap) an icon to open it. Start up there in the corner has everything else.', 11000, [['Show me around', () => WM.open('notepad', { path: 'C:\\My Documents\\readme.txt' })], ['Thanks', () => {}]]), 1400);
    }
  },
  bios() {
    return new Promise(res => {
      const o = h('div#bios.over', { 'aria-label': 'Starting up' }); document.body.append(o);
      const logo = h('div.logo', 'Ember BIOS v4.51PG\nAn Energy Star Ally\n   ▲ ▲ ▲');
      const pre = h('div'); o.append(logo, pre);
      const L = ['BurnBIOS (C) 1998 Ember Systems, Inc.', '', 'Main Processor : Pentium(R)-ish 233MHz', 'Memory Testing : ', '', 'Detecting IDE Primary Master ... BURN-HD 2.1GB', 'Detecting IDE Primary Slave  ... None', 'Detecting IDE Secondary Master ... CD-ROM 24X', 'Gecko ........................ 1 detected (Tuko)', 'System date .................. ' + (() => { const d = new Date(); return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + '/' + News.year(); })(), 'Weekly tokens ................ 100% (now burning)', '', 'Starting Burnware...'];
      let k = 0, mem = 0, skip = false;
      const end = () => { o.remove(); res(); };
      o.addEventListener('pointerdown', () => { skip = true; }); addEventListener('keydown', () => { skip = true; }, { once: true });
      const next = () => {
        if (skip) return end();
        if (k === 3 && mem < 65536) { mem = Math.min(65536, mem + 8192); pre.textContent = L.slice(0, 3).join('\n') + '\nMemory Testing : ' + mem + 'K' + (mem === 65536 ? ' OK' : ''); Sound.key(); return setTimeout(next, 40); }
        if (k >= L.length) return setTimeout(end, 250);
        k++; pre.textContent = L.slice(0, k).map((l, i) => i === 3 ? 'Memory Testing : 65536K OK' : l).join('\n'); setTimeout(next, k === 1 ? 160 : 85);
      };
      Sound.bsod(); setTimeout(next, 120);
    });
  },
  splash(ms) {
    return new Promise(res => {
      const cv = h('canvas', { width: 64, height: 48 }), g = cv.getContext('2d'); Icons.draw(SPR.flame, 3, g, 8, 0);
      const o = h('div#splash.over', { 'aria-label': 'Burnware is starting' }, cv, h('h1', 'Burn', h('i', 'ware')), h('div.bar', h('i')), h('small', 'Starting Burnware...'));
      document.body.append(o);
      setTimeout(() => { o.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 }).onfinish = () => { o.remove(); res(); }; }, ms);
    });
  },
  async askShutdown() {
    const r = await WM.ask('Shut Down Burnware', 'What do you want the computer to do?', ['Shut down', 'Restart', 'Cancel'], 'power');
    if (r === 'Shut down') this.shutdown(false); else if (r === 'Restart') this.shutdown(true);
  },
  async shutdown(restart) {
    this.ready = false; Sound.shutdown(); Music.stop(); Start.toggle(false);
    const o = h('div#splash.over', h('h1', 'Burn', h('i', 'ware')), h('small', restart ? 'Burnware is restarting...' : 'Burnware is shutting down...')); document.body.append(o);
    await wait(1300); WM.closeAll(); o.remove();
    if (restart) { await this.powerOn(false); return; }
    const off = h('div#off.over', { role: 'button', tabIndex: 0, 'aria-label': 'Turn the computer back on' }, h('div', 'It\'s now safe to turn off', h('br'), 'your computer.', h('small', '(or click to turn it back on)')));
    document.body.append(off);
    const on = () => { off.remove(); this.powerOn(false); };
    off.onclick = on; off.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') on(); };
  },
  bsod(code, why) {
    if ($('#bsod')) return;
    Sound.bsod(); Music.stop(); this.ready = false;
    const o = h('div#bsod.over', { role: 'alertdialog', tabIndex: 0, 'aria-label': 'Fatal error' }, h('div.box',
      h('div.hd', ' BURNWARE '),
      h('p', `A fatal exception 0E has occurred at 0028:C0FFEE42 in VXD BURN(01) + 00001998. The current application will be terminated.`),
      h('p', `${code}: ${why}`),
      h('p', '*  Press any key to restart your computer.', h('br'), '*  Nothing was actually deleted. Burnware is very forgiving.'),
      h('p', { style: { textAlign: 'center' } }, 'Press any key to continue ', h('span.blink', '_'))));
    document.body.append(o); setTimeout(() => o.focus(), 30);
    const go = () => { removeEventListener('keydown', go); o.remove(); WM.closeAll(); this.powerOn(false); };
    setTimeout(() => { o.addEventListener('pointerdown', go, { once: true }); addEventListener('keydown', go, { once: true }); }, 700);
  },
};
/* ---- 99-main.js ---- */
/* ============================================================
   Start everything. A republish of this page keeps the computer
   switched on (it skips the boot) through the viewer's live hook.
   ============================================================ */
function startBurnware(data) {
  Store.load(); FS.load();
  Wall.scheme(Store.data.scheme);
  Desktop.init(); Start.init(); Tuko.init(); NewsBoard.init();
  AI.get();   // find out early whether Claude can play DialUpDan here
  let rz = null;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { Wall.paint(); for (const w of WM.wins) if (w.onResize) w.onResize(); }, 150); });
  for (const ev of ['pointerdown', 'pointermove', 'keydown', 'wheel']) addEventListener(ev, () => Saver.bump(), { passive: true });
  setInterval(() => Saver.tick(), 1000);
  addEventListener('pointerdown', () => { const a = document.activeElement; if (a && a.tagName === 'IFRAME') a.blur(); }, true);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && Start.open) Start.toggle(false); if ((e.key === 'Meta' || (e.ctrlKey && e.key === 'Escape')) && Boot.ready) Start.toggle(); });
  try { window.claude?.hot?.snapshot?.(() => ({ burnware: 1, on: Boot.ready })); } catch (e) { /* no live updates here */ }
  Wall.paint();
  if (data && data.burnware === 1 && data.on) { Boot.powerOn(true); return; }   // a new version loaded in place: stay on
  const btn = $('#powerBtn');
  btn.onclick = () => Boot.powerOn(false);
  addEventListener('keydown', function k(e) { if ($('#power')) { removeEventListener('keydown', k); Boot.powerOn(false); } });
  setTimeout(() => btn.focus(), 50);
}
window.claude?.hot?.ready ? window.claude.hot.ready(startBurnware) : startBurnware(window.claude?.hot?.data ?? {});
